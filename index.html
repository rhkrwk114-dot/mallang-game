/* ---------- 뽑기 미니게임: 움직이는 집게를 타이밍 맞춰 내린다 ----------
   지력이 높으면 집게가 느려지고, 무술·체력이 높으면 덜 미끄러진다 */
function playClaw(tries){
  return new Promise(resolve=>{
    const s=G.malang.stats,floor=[12,27,42,57,72].map(x=>({x:x+Math.random()*4-2,id:rollToy(Math.floor(s.cha/20)),got:false}));
    const spd=Math.max(.9,2-s.int*.011),grip=k=>Math.min(.97,[0,.9,.68,.45][TOYS[k].r]+s.mar*.003+s.str*.002);
    let left=tries,busy=false,t0=performance.now(),x=50,raf=0;const got=[];
    openOv(`<div class="mgame"><div class="mini-h"><b class="cute">말랑 뽑기</b><span class="sub">남은 기회 <b id="clT">${left}</b></span></div>
      <div class="claw-box" id="clBox"><div class="claw-top"></div><div class="claw" id="claw"><i class="rope" id="clRope"></i><span class="head">${clawHead()}</span><span class="held" id="clHeld"></span></div>
      ${floor.map((f,i)=>`<span class="ftoy" id="ft${i}" style="left:${f.x}%">${toySVG(f.id)}</span>`).join('')}<div class="chute">OUT</div></div>
      <p class="sub mini-tip" id="clMsg">집게가 움직일 때 눌러서 내려요. 지력이 높으면 집게가 느려지고, 무술과 체력이 높으면 덜 미끄러져요.</p>
      <div class="got" id="clGot"></div><button class="tbtn wide" id="clDrop">${ic('claw')}내리기!</button></div>`);
    const claw=$('#claw'),rope=$('#clRope'),msg=$('#clMsg');
    const loop=t=>{if(!busy){x=12+70*(.5+.5*Math.sin((t-t0)/1000*spd));claw.style.left=x+'%'}raf=requestAnimationFrame(loop)};raf=requestAnimationFrame(loop);
    const H=$('#clBox').clientHeight,setRope=h=>{rope.style.height=(H*h/100)+'px'};
    const finish=()=>{cancelAnimationFrame(raf);const b=$('#clDrop');b.innerHTML=ic('check')+'다 했어요';b.disabled=false;b.onclick=()=>{Sound.play('click');closeOv();resolve(got)}};
    $('#clDrop').onclick=()=>{
      if(busy||left<=0)return;busy=true;left--;$('#clT').textContent=left;$('#clDrop').disabled=true;Sound.play('click');
      setRope(56);
      setTimeout(()=>{
        const near=floor.map((f,i)=>({f,i,d:Math.abs(f.x-x)})).filter(o=>!o.f.got&&o.d<7).sort((a,b)=>a.d-b.d)[0];
        if(!near){msg.textContent='헛손질! 아무것도 못 잡았다.';Sound.play('bad');setRope(4);setTimeout(()=>{busy=false;if(left<=0)finish();else $('#clDrop').disabled=false},650);return}
        const el=$('#ft'+near.i),ok=Math.random()<grip(near.f.id);
        Sound.feel('jelly','press');el.classList.add('grab');$('#clHeld').innerHTML=toySVG(near.f.id);el.style.visibility='hidden';
        setRope(4);
        setTimeout(()=>{
          if(!ok){$('#clHeld').innerHTML='';el.style.visibility='';el.classList.remove('grab');el.classList.add('slip');setTimeout(()=>el.classList.remove('slip'),500);msg.textContent='앗, 미끄러졌다!';Sound.play('bad');busy=false;if(left<=0)finish();else $('#clDrop').disabled=false;return}
          claw.style.transition='left .6s ease-in-out';claw.style.left='90%';
          setTimeout(()=>{
            near.f.got=true;$('#clHeld').innerHTML='';claw.style.transition='';t0=performance.now()-(Math.PI/2)/spd*1000;
            got.push(near.f.id);addToy(near.f.id);const T=TOYS[near.f.id];
            $('#clGot').insertAdjacentHTML('beforeend',`<span class="gtoy r${T.r}">${toySVG(near.f.id)}<small>${T.n}</small></span>`);
            msg.textContent=`${T.n} 획득! (${RARE_N[T.r]})`;Sound.play(T.r>=2?'good':'coin');Sound.feel('jelly','release',.5);
            busy=false;if(left<=0)finish();else $('#clDrop').disabled=false;
          },650);
        },650);
      },650);
    };
  });
}

/* ---------- 말랑이 거래: 돗자리에 펼쳐 놓고 서로 바꾸기 ----------
   상대 취향(좋아함 ×1.6 / 싫어함 ×0.6)과 친밀도로 거래 기분이 정해진다. 매력이 높으면 한 번 졸라 볼 수 있다 */
function npcVal(id,toy){const T=TOYS[toy],t=NPC_TASTE[id];let v=[0,1,3,6][T.r];if(T.tags.some(g=>t.like.includes(g)))v*=1.6;if(T.tags.some(g=>t.dis.includes(g)))v*=.6;return v}
function npcStock(id){
  const t=NPC_TASTE[id],aff=G.malang.rel[id].aff,out=[];
  const liked=TOY_IDS.filter(k=>TOYS[k].tags.some(g=>t.like.includes(g))&&TOYS[k].r<3),disl=TOY_IDS.filter(k=>TOYS[k].tags.some(g=>t.dis.includes(g)));
  out.push(pick(liked),pick(liked),rollToy());if(disl.length)out.push(pick(disl));
  if(aff>=55||Math.random()<.12)out.push(pick(TOY_IDS.filter(k=>TOYS[k].r===3)));
  return [...new Set(out)].slice(0,5);
}
function pickTrader(){
  const ids=metIds();if(!ids.length)return null;
  const w=ids.map(id=>[id,Math.max(5,G.malang.rel[id].aff+20)]);let sum=w.reduce((a,b)=>a+b[1],0),r=Math.random()*sum;
  for(const [id,v] of w){r-=v;if(r<=0)return id}return ids[0];
}
function playTrade(id){
  return new Promise(resolve=>{
    const N=NPCS[id],t=NPC_TASTE[id],stock=npcStock(id),want=new Set(),give={};let begged=false,bonus=0,done=false;
    if(!toyCount()){const g=rollToy();addToy(g);toast(`${N.name}: 장난감이 없어? 이거 하나 줄게!`,'npc:'+id)}
    const ratio=()=>{const gv=Object.entries(give).reduce((a,[k,n])=>a+npcVal(id,k)*n,0),wv=[...want].reduce((a,k)=>a+npcVal(id,k),0);return wv?gv/wv:gv?9:0};
    const need=()=>1-Math.min(.25,G.malang.rel[id].aff/400)-bonus;
    const mood=()=>{const r=ratio(),n=need();if(!want.size&&!Object.keys(give).length)return [0,'뭐랑 바꿀래? 난 '+t.like.map(g=>TAGN[g]).join('이랑 ')+'이 좋더라~','normal'];
      if(!want.size)return [3,'선물이야? 진짜?','happy'];
      if(r>=n*1.4)return [4,'우와, 진짜? 최고야!','happy'];if(r>=n)return [3,'좋아! 바꾸자!','happy'];if(r>=n*.8)return [2,'거의 다 됐어... 조금만 더?','shy'];if(r>=n*.5)return [1,'음... 그건 좀...','sad'];return [0,'에이~ 그건 안 돼.','grumpy']};
    const render=()=>{
      const [lv,line,face]=mood(),ok=want.size?lv>=3:Object.keys(give).length>0;
      openOv(`<div class="trade"><div class="tr-top"><div class="tr-av">${malangSVG({sp:N.sp,pal:N.pal,w:N.w,face,acc:N.acc})}</div><div class="tr-say"><b class="cute">${N.name}</b><p id="trLine">${line}</p>
        <div class="tr-meter">${[0,1,2,3,4].map(i=>`<i class="${i<=lv&&(want.size||Object.keys(give).length)?'on l'+lv:''}"></i>`).join('')}</div></div></div>
        <div class="tr-sec">${N.name}의 돗자리 <span class="sub">갖고 싶은 걸 골라요</span></div>
        <div class="mat">${stock.map(k=>`<button class="mtoy${want.has(k)?' on':''} r${TOYS[k].r}" data-w="${k}">${toySVG(k)}<small>${TOYS[k].n}</small>${want.has(k)?`<i class="chk">${ic('check')}</i>`:''}</button>`).join('')}</div>
        <div class="tr-sec">내 장난감 <span class="sub">내놓을 걸 골라요</span></div>
        <div class="mine">${TOY_IDS.filter(k=>G.toys[k]).map(k=>`<button class="mtoy${give[k]?' on':''} r${TOYS[k].r}" data-g="${k}">${toySVG(k)}<small>${TOYS[k].n}</small><em>${give[k]?give[k]+'/':''}${G.toys[k]}</em></button>`).join('')||'<p class="sub">장난감이 없어요</p>'}</div>
        <div class="actions" style="margin-top:12px"><button class="tbtn ghost sq" id="trQuit" aria-label="그만할래">${ic('back')}</button>
        <button class="tbtn ghost" id="trBeg" style="padding:0 12px" ${begged||!want.size||ok?'disabled':''}>${ic('cha')}조르기</button>
        <button class="tbtn grow1" id="trGo" ${ok?'':'disabled'}>${ic('swap')}${want.size?'바꾸자':'선물'}</button></div></div>`);
      document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{const k=b.dataset.w;want.has(k)?want.delete(k):want.add(k);Sound.play('pick');render()});
      document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{const k=b.dataset.g;give[k]=((give[k]||0)+1)%((G.toys[k]||0)+1);if(!give[k])delete give[k];Sound.play('pick');render()});
      $('#trQuit').onclick=()=>{Sound.play('click');closeOv();resolve({traded:false})};
      $('#trBeg').onclick=()=>{
        begged=true;const s=G.malang.stats;
        if(s.cha>=20&&Math.random()<.35+s.cha/150){bonus=Math.min(.25,s.cha/300);Sound.play('good');render();$('#trLine').textContent='...알았어, 너니까 봐준다!'}
        else{changeAff(id,-2);Sound.play('bad');render();$('#trLine').textContent='조르지 마~ (조금 서운해함)'}
      };
      $('#trGo').onclick=()=>{
        if(done)return;done=true;const r=ratio();
        for(const [k,n] of Object.entries(give)){G.toys[k]-=n;if(G.toys[k]<=0)delete G.toys[k]}
        want.forEach(k=>addToy(k));
        const likedGift=Object.keys(give).some(k=>TOYS[k].tags.some(g=>t.like.includes(g)));
        const a=changeAff(id,Math.round(3+Math.min(8,Math.max(0,(r-1)*8))+(likedGift?3:0)));
        const gn=Object.keys(give).map(k=>TOYS[k].n),wn=[...want].map(k=>TOYS[k].n);
        addMem(id,wn.length?`${gn.join(', ')}${gn.length?'(이)랑':''} ${wn.join(', ')}${jo(wn[wn.length-1],'을','를').slice(-1)} 바꿨다`:`${gn.join(', ')}${jo(gn[gn.length-1],'을','를').slice(-1)} 선물했다`);
        G.malang.flags['traded_'+id]=G.week;G.dex.npc[id]=1;
        Sound.play('good');Sound.feel(SPECIES[N.sp].snd,'release',.5);save();
        openOv(`${sceneHTML('flea',id,{tag:'거래 성공',me:'happy',npcFace:'happy',sparkle:true})}<div class="ev-b"><p class="ev-p ev-r">${likedGift?`"이거 딱 내 취향이야!" ${N.name}${jo(N.name,'이','가').slice(-1)} 펄쩍 뛰었다.`:`"거래 성립!" ${N.name}${jo(N.name,'이','가').slice(-1)} 흐뭇하게 출렁였다.`}</p>
          <div class="fxl">${[...want].map(k=>`<div>${toySVG(k,'mini')}<span>${TOYS[k].n} 받음</span></div>`).join('')}${Object.keys(give).map(k=>`<div>${toySVG(k,'mini')}<span>${TOYS[k].n} 건넴</span></div>`).join('')}<div>${icx('npc:'+id)}<span>${affText(id,a)}</span></div></div>
          <button class="tbtn wide" id="trOk">확인</button></div>`);
        $('#trOk').onclick=()=>{Sound.play('click');closeOv();resolve({traded:true,want:[...want]})};
      };
    };
    Sound.play('meet');render();
  });
}

const TOY_MODE={crunchball:'bounce',marble:'bounce',moonmochi:'gaze',star:'gaze',peach:'hug',tofu:'hug',cloud:'hug',heart:'hug',ghost:'hug',paw:'hug',bear:'hug',
  popit:'pop',bubble:'pop',dango:'munch',egg:'munch',bread:'munch',donut:'munch',riceball:'munch',goldbread:'gaze',cheesek:'wear',duck:'wear',slime:'jar',rainbow:'stretch',squid:'stretch'};
const TOY_SAY={bounce:['통! 통!','받아라~','어디 가!'],hug:['포근해~','이거 내 거야','꼬옥...'],pop:['뽁!','뽁뽁뽁!','멈출 수가 없어'],munch:['냠...','앙! (딱딱해)','먹는 척~'],
  wear:['어때? 어울려?','모자 생겼다!','멋지지?'],stretch:['쭈욱~','나보다 더 늘어나!','찰싹!'],gaze:['반짝반짝...','예쁘다...','빛난다!']};
const SP_FAV={jelly:['jelly'],pudding:['food'],mochi:['squishy'],marsh:['cute'],bread:['bread'],bun:['food'],butter:['bread'],crunch:['crunch'],cheese:['food','cool'],beads:['sparkle']};
const sleepMs=x=>new Promise(r=>setTimeout(r,x));
function placeToyAtHead(el){const st=$('#stage').getBoundingClientRect(),mr=$('#mlgInner').getBoundingClientRect();el.style.left=((mr.left-st.left+mr.width/2)/st.width*100)+'%';el.style.bottom=((st.bottom-mr.top-10)/st.height*100)+'%'}
const PLAY_N={bounce:'통통 튀기기',hug:'꼭 안기',pop:'뽁뽁 누르기',munch:'먹는 척하기',wear:'머리에 쓰기',stretch:'같이 늘어나기',gaze:'반짝임 구경',jar:'통 뒤집어 꺼내기'};
function showToy(id){
  const T=TOYS[id];if(!T)return;const n=G.toys[id]||0;
  openOv(`<div class="ev-b toy-d"><div class="td-art">${toySVG(id)}</div><div class="ev-t big">${T.n}</div>
    <p class="ev-p">${RARE_N[T.r]} · ${n}개 가지고 있어요</p>

async function playToy(id,auto){
  if(ui.toyBusy||ui.running||SQ.press||!TOYS[id])return;ui.toyBusy=true;
  try{await playToyInner(id,auto)}catch(e){console.warn(e)}finally{ui.toyBusy=false;const el=$('#toyPlay');if(el&&el.className.includes('show')){el.className='';el.innerHTML=''}}
}
async function playToyInner(id,auto){
  const T=TOYS[id],mode=TOY_MODE[id]||'hug',el=$('#toyPlay'),S=SPECIES[G.malang.species];
  const fav=T.tags.some(g=>(SP_FAV[G.malang.species]||[]).includes(g)||persona().toy.includes(g));
  el.removeAttribute('style');el.innerHTML=toySVG(id);el.className='show tp-in';Sound.play('pick');
  const say=()=>speak(Math.random()<.45?talk('toy'):pick(TOY_SAY[mode]),1500);
  await sleepMs(550);
  switch(mode){
    case 'bounce':setAnim('hop');setFace('happy');el.className='show tp-bounce';say();for(let i=0;i<4;i++){Sound.play('boing');await sleepMs(400)}setAnim('squish');el.className='show tp-rest';await sleepMs(600);break;
    case 'hug':el.className='show tp-hug';setAnim('squish');setFace('press');Sound.feel(S.snd,'press');say();await sleepMs(900);setAnim('sleep');setFace('sleep');hearts(3);Sound.play('heart');await sleepMs(1300);setFace('happy');break;
    case 'pop':el.className='show tp-press';setAnim('study');setFace('focus');say();for(let i=0;i<7;i++){Sound.feel('crunch','tick');buzz([4]);await sleepMs(190)}setAnim('squish');setFace('happy');el.className='show tp-rest';await sleepMs(500);break;
    case 'munch':el.className='show tp-munch';setAnim('eat');setFace('eat');Sound.play('eat');say();await sleepMs(1300);setAnim('idle');setFace('shy');el.className='show tp-rest';speak(fav?'...장난감인데 맛있는 냄새 나.':'...아, 이거 장난감이지.',1400,'mur');await sleepMs(1300);break;
    case 'wear':el.className='show tp-wear';placeToyAtHead(el);setAnim('hop');setFace('happy');Sound.play('pick');say();await sleepMs(1500);setAnim('squish');await sleepMs(700);break;
    case 'jar':{
      // 한 장의 SVG 안에서 통과 슬라임을 같은 좌표로 그린다 → 통 입구에서 이어져 흘러나오고, 떨어지고, 퍼지고, 다시 빨려 들어간다
      const gid='jg'+(++UID),FLOOR=114;
      const TJ=TOYS[id]||TOYS.slime,ca=TJ.c[0],cb=TJ.c[1],raw=toySVG(id).replace('<ellipse cx="30" cy="54" rx="18" ry="3.5" fill="#3e2a20" opacity=".15"/>',''),art=raw.slice(raw.indexOf('>')+1,raw.lastIndexOf('</svg>'));
      el.innerHTML=`<svg class="jar2" viewBox="0 0 60 120"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${ca}"/><stop offset="1" stop-color="${cb}"/></linearGradient></defs>
        <ellipse id="${gid}sh" cx="30" cy="${FLOOR+2}" rx="14" ry="2.6" fill="#4e3626" opacity=".14"/>
        <path id="${gid}pd" fill="url(#${gid})" stroke="#3e3431" stroke-width="1.6" stroke-linejoin="round"/><ellipse id="${gid}ph" fill="#fff" opacity=".6"/>
        <path id="${gid}dr" fill="url(#${gid})" stroke="#3e3431" stroke-width="1.6" stroke-linejoin="round"/>
        <g id="${gid}jar"><svg x="-17" y="-18" width="34" height="34" viewBox="0 0 60 60" overflow="visible">${art}</svg></g></svg>`;
      el.className='show tp-jar2';
      const q=s=>el.querySelector('#'+gid+s),jar=q('jar'),dr=q('dr'),pd=q('pd'),ph=q('ph'),sh=q('sh');
      const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,cl=t=>Math.max(0,Math.min(1,t)),lerp=(a,b,t)=>a+(b-a)*t;
      const T={flip:[400,1100],drip:[1100,2700],land:[2700,3150],snap:[3150,3500],rest:[3500,4500],back:[4500,5400],down:[5400,6000],end:6100};
      let fired={};const once=(k,f)=>{if(!fired[k]){fired[k]=1;f()}};
      await new Promise(done=>{const t0=performance.now();const frame=now=>{
        if(!el.isConnected){done();return}
        const t=now-t0,ph1=(a,b)=>cl((t-a)/(b-a));
        // 통: 들어 올려 뒤집기 → 마지막에 원위치
        const up=ease(ph1(...T.flip))-ease(ph1(...T.down)),rot=180*up,jy=lerp(FLOOR-11.5,44,up);
        jar.setAttribute('transform',`translate(30 ${jy.toFixed(2)}) rotate(${rot.toFixed(1)})`);
        // 입구 위치(뒤집히면 아래쪽)
        const a=rot*Math.PI/180,mouth={x:30,y:jy-11.2*Math.cos(a)}; // 통 입구(-17)를 회전한 위치
        // 흘러내리는 줄기: 중력처럼 가속, 끝은 방울, 바닥에 닿으면 웅덩이로
        let L=0,neck=0,blob=0;
        if(t>=T.drip[0]&&t<T.snap[1]&&up>.95){const k=ph1(...T.drip);L=Math.min(FLOOR-mouth.y-3,(FLOOR-mouth.y)*k*k*1.05);blob=lerp(3,7.5,k);neck=lerp(9,4.5,k);
          if(t>=T.land[0]){const k2=ph1(T.land[0],T.snap[1]);neck=lerp(4.5,1.2,k2);blob=lerp(7.5,3,k2)}}
        if(t>=T.back[0]&&t<T.back[1]){const k=ph1(...T.back);L=(FLOOR-mouth.y-3)*Math.sin(Math.PI*k)*.95;neck=lerp(2,6,Math.sin(Math.PI*k));blob=lerp(6,3,k)}
        if(L>.5){const x=mouth.x,y0=mouth.y,y1=y0+L;dr.setAttribute('d',`M${x-7.5} ${y0}C${x-7.5} ${y0+L*.25} ${x-neck} ${y0+L*.45} ${x-neck} ${y1-blob}A${blob} ${blob*1.1} 0 1 0 ${x+neck} ${y1-blob}C${x+neck} ${y0+L*.45} ${x+7.5} ${y0+L*.25} ${x+7.5} ${y0}Z`)}else dr.setAttribute('d','');
        // 바닥 웅덩이: 닿을 때 퍼지고, 쉬는 동안 말랑하게 처지고 흔들리고, 돌아갈 때 줄어든다
        let pr=0,pht=0;
        if(t>=T.land[0]&&t<T.back[1]){const grow=ease(ph1(T.land[0],T.snap[1])),shrink=ease(ph1(...T.back));const wob=t>=T.snap[0]&&t<T.back[0]?Math.sin((t-T.snap[0])/120)*Math.exp(-(t-T.snap[0])/700):0;
          pr=(17+wob*4)*grow*(1-shrink);pht=(9-wob*3)*grow*(1-shrink)+(t<T.back[0]?Math.max(0,1-ph1(T.rest[0],T.rest[1]))*1.5:0)}
        if(pr>.6){pd.setAttribute('d',`M${30-pr} ${FLOOR}C${30-pr} ${FLOOR-pht*1.1} ${30-pr*.45} ${FLOOR-pht*1.9} 30 ${FLOOR-pht*1.9}S${30+pr} ${FLOOR-pht*1.1} ${30+pr} ${FLOOR}Q30 ${FLOOR+2} ${30-pr} ${FLOOR}Z`);ph.setAttribute('cx',30-pr*.35);ph.setAttribute('cy',FLOOR-pht*1.3);ph.setAttribute('rx',Math.max(.1,pr*.22));ph.setAttribute('ry',Math.max(.1,pht*.25))}
        else{pd.setAttribute('d','');ph.setAttribute('rx',0);ph.setAttribute('ry',0)}
        sh.setAttribute('rx',(12+Math.max(pr*.9,(1-up)*2)).toFixed(1));
        // 소리·반응은 시점마다 한 번씩
        if(t>=T.flip[0])once('f',()=>{Sound.play('pick');buzz([6])});
        if(t>=T.drip[0])once('d',()=>Sound.feel('jelly','stretch'));
        if(t>=T.land[0])once('l',()=>{Sound.feel('jelly','press');buzz([12]);setAnim('hop');setFace('happy');setTimeout(()=>setAnim('idle'),900)});
        if(t>=T.rest[0]+200)once('p',()=>{speak(pick(['쭈욱~ 나왔다!','철퍽! 말랑말랑해!','흘러내린다~']),1600,'sh');hearts(2);Sound.feel('jelly','release',.6)});
        if(t>=T.back[0])once('b',()=>Sound.feel('jelly','stretch'));
        if(t>=T.down[0])once('w',()=>Sound.play('pick'));
        if(t<T.end)requestAnimationFrame(frame);else done()};requestAnimationFrame(frame)});
      setAnim('idle');setFace('happy');say();await sleepMs(300);break}
    case 'stretch':el.className='show tp-stretch';setAnim('stretchy');setFace('effort');Sound.feel(S.snd,'stretch');say();await sleepMs(1500);setAnim('squish');setFace('happy');Sound.feel(S.snd,'release',.5);el.className='show tp-rest';await sleepMs(600);break;
    case 'gaze':el.className='show tp-gaze';setAnim('idle');setFace('shy');Sound.play('good');say();await sleepMs(900);hearts(2);await sleepMs(1200);break;
  }
  if(fav){speak(talk('touch').replace(/[.!?~]*$/,'')+'... 이거 제일 좋아!',1400,'sh');hearts(4);await sleepMs(900)}
  if(!auto&&(G.toyPlays||0)<3){G.toyPlays=(G.toyPlays||0)+1;applyDelta({aff:fav?2:1,stress:-3},{quiet:true});save()}
  el.className='hide';await sleepMs(350);el.className='';el.innerHTML='';
  setAnim('idle');setFace(moodFace());ui.toyBusy=false;
}

  const sets=Object.entries(TOY_SETS).map(([sid,S])=>`<div class="card set${G.setsDone[sid]?' done':''}"><div class="set-h"><b class="cute">${S.n}</b>${G.setsDone[sid]?`<span class="hatch-new">${ic('trophy')}완성</span>`:`<span class="sub">${S.toys.filter(t=>G.toyDex[t]).length}/4 · 완성하면 100코인 + 캡슐 행운</span>`}</div><div class="set-row">${S.toys.map(t=>`<span class="stoy${G.toyDex[t]?'':' sil'}">${toySVG(t)}</span>`).join('')}</div></div>`).join('');

    return `<div class="etile tt r${T.r} sil" aria-disabled="true">${toySVG(k)}<b>???</b><small>${RARE_N[T.r]}</small></div>`}).join('');
  $('#pin').innerHTML=`${panelHead('toybox','장난감 상자')}<div class="pb">

    <div class="sec">세트</div>${sets}
    <div class="sec">모든 장난감</div><p class="hint">갖고 있는 장난감을 누르면 말랑이와 놀 수 있어요. 흐린 칸은 발견했지만 지금은 없는 장난감이에요 (뽑기나 교환으로 다시 얻을 수 있어요).</p><div class="egrid">${all}</div></div>`;
  $('#pin').querySelectorAll('[data-play]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();Sound.play('pick');showToy(b.dataset.play)}));
  $('#tyClaw').onclick=async()=>{if(G.money<15)return;G.money-=15;save();closePanel();renderHeader();await playClaw(1);save();renderAll()};
}

function tier(score){return score>=62?2:score>=38?1:0}

function insectSVG(k,mood='happy'){
  const defs=[],G2=(c1,c2)=>{const id='ig'+(++UID);defs.push(`<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient>`);return `url(#${id})`};

  let b='';

  if(k==='bee')b=`${ant('#5a4636')}<ellipse cx="74" cy="112" rx="16" ry="11" fill="#e8f6ff" opacity=".85" transform="rotate(-25 74 112)"/><ellipse cx="126" cy="112" rx="16" ry="11" fill="#e8f6ff" opacity=".85" transform="rotate(25 126 112)"/><ellipse cx="100" cy="140" rx="40" ry="32" fill="${G2('#ffe27a','#f5b93a')}"/><path d="M66 134q34 10 68 0M64 150q36 10 72 0" stroke="#6a4a36" stroke-width="7" fill="none" stroke-linecap="round"/><ellipse cx="84" cy="124" rx="8" ry="5" fill="#fff" opacity=".5" transform="rotate(-25 84 124)"/>${eye(90,128)}${eye(110,128)}${blush(136)}${mouth(134)}<path d="M100 172l-4 6h8z" fill="#6a4a36"/>`;

const hpBar=(n,max,c)=>`<span class="hpb">${[...Array(max)].map((_,i)=>`<i class="${i<n?'on':''}" style="--c:${c}"></i>`).join('')}</span>`;
function wildBattle(){
  const W=pick(WILD),s=G.malang.stats,st={me:3,foe:W.hp,round:1};
  const wild={bug:W.k};
  const gauges=()=>`<span class="hpl">${ic('heart')}내 기운 ${hpBar(st.me,3,'#f28fb0')}</span><span class="hpl">${ic('leaf')}${W.n}의 장난기 ${hpBar(st.foe,W.hp,'#9ccf6a')}</span>`;
  const stepEv=msg=>({id:'act_wild',act:true,wild,title:`${W.n}와 놀이 대결 (${st.round}번째)`,place:'mountain',
    text:`${msg?msg+'<br>':''}${gauges()}`,
    choices:[{t:'통통 같이 뛰기',r:()=>turn('hop')},{t:'풀잎 흔들어 주기',r:()=>turn('leaf')},{t:'살금살금 다가가기',r:()=>turn('sneak')},{t:'손 흔들고 보내 준다',r:()=>({text:`${W.n}${jo(W.n,'이','가').slice(-1)} 더듬이를 까딱이며 풀숲으로 돌아갔다. 오늘은 여기까지.`,mood:'mixed',d:{stress:-2}})}]});
  const end=()=>{
    if(st.foe<=0){G.malang.flags.wildWins=(G.malang.flags.wildWins||0)+1;return {text:`장난기가 다 풀린 ${W.n}${jo(W.n,'이','가').slice(-1)} 머리 위를 한 바퀴 빙 돌고 숲으로 돌아갔다. 곤충 친구가 생겼다!`,mood:'good',d:{str:1,cha:2,stress:-5},toy:Math.random()<.35?rollToy(10):undefined,say:true}}
    if(st.me<=0)return {text:`기운이 다 빠져 풀밭에 벌러덩 누웠다. ${W.n}${jo(W.n,'이','가').slice(-1)} 코끝에 잠깐 앉았다가 날아갔다.`,mood:'mixed',d:{stress:2},say:true};
    return null};
  const turn=k=>{
    let msg='';const hop=s.str+rnd()*24,leaf=(s.art+s.cha)/2+rnd()*24,sneak=(s.int+s.mar)/2+rnd()*24;
    if(k==='hop'){if(hop>=W.pow){st.foe-=hop>=W.pow+16?2:1;msg=`통통! ${W.n}${jo(W.n,'이','가').slice(-1)} 신나서 같이 뛰었다.`}else{st.me--;msg='통통 뛰다가 몸이 꼬였다. 데굴.'}}
    if(k==='leaf'){if(leaf>=W.pow-2){st.foe--;msg=`살랑살랑~ ${W.n}${jo(W.n,'이','가').slice(-1)} 풀잎을 따라 빙글빙글 돌았다.`}else{st.me--;msg='풀잎이 코에 들어갔다. 에취!'}}
    if(k==='sneak'){if(sneak>=W.pow+4){st.foe-=2;msg=`살금살금... 콕! ${W.n}${jo(W.n,'이','가').slice(-1)} 깜짝 놀라 웃음이 터졌다.`}else{st.me--;msg=`들켰다! ${W.n}${jo(W.n,'이','가').slice(-1)} 파닥파닥 도망쳤다가 돌아왔다.`}}

// 결과창을 닫은 뒤 가끔 친한 친구가 먼저 찾아온다 (단짝이면 더 자주)
function maybeVisit(){
  if(G.phase!=='plan'||ui.running)return;const m=G.malang;
  const c=metIds().filter(id=>m.rel[id].aff>=40);if(!c.length)return;
  const id=c.sort((a,b)=>(m.flags['bond_'+b]?30:0)+m.rel[b].aff-(m.flags['bond_'+a]?30:0)-m.rel[a].aff)[Math.random()<.6?0:Math.floor(Math.random()*c.length)];
  const p=m.flags['bond_'+id]?.5:m.rel[id].aff>=60?.38:.25;if(Math.random()>p)return;
  (async()=>{const c=mkCtx('rest','home');let r=await runEvent(visitEvent(id),c);while(r&&r.next)r=await runEvent(r.next,c);save();renderAll()})();

// 집에서 쉬는 동안 친한 친구가 창밖에서 손을 흔들고 간다
function homeWave(){

// 회상 컷: 컷마다 다른 카메라(구도)와 감정 연출. 전부 정지 그림이지만 만화처럼 과장한다
const CAMS=['high','wide','low','two','dutch','close','gag','hero'];
function emoFX(kind,sfx){
  const st=(x,y,s=1,r=0)=>`<svg class="fx-st" style="left:${x}%;top:${y}%;width:${22*s}px;transform:rotate(${r}deg)" viewBox="0 0 24 24"><path d="M12 2l2.6 6.4L21 9l-5 4.3L17.6 20 12 16.4 6.4 20 8 13.3 3 9l6.4-.6z" fill="#ffe27a" stroke="#fff" stroke-width="1.5"/></svg>`;
  const hrt=(x,y,s=1,r=0)=>`<svg class="fx-st" style="left:${x}%;top:${y}%;width:${22*s}px;transform:rotate(${r}deg)" viewBox="0 0 24 24"><path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z" fill="#ff8fb0" stroke="#fff" stroke-width="1.5"/></svg>`;
  const sweat=(x,y)=>`<svg class="fx-st" style="left:${x}%;top:${y}%;width:20px" viewBox="0 0 20 28"><path d="M10 2C14 10 18 14 18 19a8 8 0 0 1-16 0c0-5 4-9 8-17z" fill="#bfe4ff" stroke="#fff" stroke-width="1.5"/></svg>`;
  const burst=(c1,c2)=>`<svg class="fx-burst" viewBox="0 0 200 140" preserveAspectRatio="xMidYMid slice"><g transform="translate(100 84)">${[...Array(16)].map((_,i)=>{const a=i/16*Math.PI*2,b=(i+.5)/16*Math.PI*2;return `<path d="M0 0L${Math.cos(a)*170} ${Math.sin(a)*170}L${Math.cos(b)*170} ${Math.sin(b)*170}Z" fill="${i%2?c1:c2}"/>`}).join('')}</g></svg>`;
  switch(kind){
    case 'glow':return `<i class="fx-glow"></i>${st(18,16,.7,-10)}${st(80,22,.55,14)}`;
    case 'sweat':return sweat(62,30)+`<b class="fx-word cute" style="right:7%;top:12%">...?!</b>`;
    case 'hero':return burst('rgba(255,226,140,.38)','rgba(255,255,255,0)')+st(16,20,1,-12)+st(82,14,.8,10);
    case 'heart':return `<i class="fx-glow pink"></i>${hrt(46,10,1.1,-6)}${hrt(30,24,.7,-16)}${hrt(64,22,.8,12)}`;
    case 'dutch':return `<b class="fx-word cute" style="left:6%;top:10%">두근!</b>`+st(84,16,.7,20);
    case 'night':return [[12,10],[28,22],[70,8],[86,26],[52,14]].map(([x,y],i)=>st(x,y,.45+(i%2)*.2,i*15)).join('')+`<i class="fx-glow moon"></i>`;
    case 'gag':return burst('rgba(255,140,170,.28)','rgba(255,255,255,0)')+`<b class="fx-sfx cute">${sfx||'펑!'}</b>`;
    case 'final':return `<i class="fx-glow"></i>${st(14,14,.9,-14)}${st(84,12,1,12)}${st(72,30,.55,0)}${hrt(24,30,.6,-10)}`;
  }
  return '';
}
function storyScene(p,idx){
  const cam=p.comic?'gag':(CAMS[idx]||'wide');
  const emo=p.comic?'gag':idx===0?'glow':idx===1?'sweat':idx===2?'hero':idx===3?'heart':idx===4?(p.me==='sad'?'sweat':'dutch'):idx===5?'night':'final';
  let h=sceneHTML(p.place,p.npc,{me:p.me,meAcc:p.acc,npcFace:p.npcFace,w:p.w,age:p.age});
  h=h.replace('<div class="scene">',`<div class="scene st-cam cam-${cam}">`);
  const all=emoFX(emo,p.comic&&p.comic.sfx),re=/<svg class="fx-burst"[\s\S]*?<\/svg>|<i class="fx-glow[^>]*><\/i>/g,back=(all.match(re)||[]).join(''),front=all.replace(re,'');
  return h.slice(0,-6)+`<div class="fx-layer back">${back}</div><div class="fx-layer front">${front}</div>${p.comic?`<span class="cbub cute">${p.comic.line}</span>`:''}</div>`;
}

/* ---------- 물속 연출: 수영장·목욕탕에서는 그림자 대신 말랑이 앞에 물 한 겹 ---------- */
function waterFrontSVG(kind){
  const wave=(y,a,n=16)=>{let d=`M-40 ${y}`;for(let i=0;i<n;i++)d+=` q${12.5} ${i%2?a:-a} 25 0`;return d};
  if(kind==='pool')return `<div class="wf-wave"><svg viewBox="0 0 480 100" preserveAspectRatio="none"><defs><linearGradient id="wfP" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9f3ff" stop-opacity=".62"/><stop offset=".18" stop-color="#86d8f0" stop-opacity=".5"/><stop offset="1" stop-color="#3fb0d8" stop-opacity=".78"/></linearGradient></defs>
    <path d="${wave(10,3)} V100 H-40Z" fill="url(#wfP)"/><path d="${wave(10,3)}" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="2.4"/>
    ${[[60,40],[150,58],[250,36],[330,62],[420,46]].map(([x,y])=>`<path d="M${x} ${y}q10-5 20 0t20 0" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"/>`).join('')}</svg></div>`;
  return `<div class="wf-wave"><svg viewBox="0 0 480 100" preserveAspectRatio="none"><defs><linearGradient id="wfS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d6fbf6" stop-opacity=".6"/><stop offset="1" stop-color="#7fd0c8" stop-opacity=".7"/></linearGradient></defs>
    <path d="${wave(8,2)} V100 H-40Z" fill="url(#wfS)"/><path d="${wave(8,2)}" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="2"/></svg></div>
    <svg class="wf-tub" viewBox="0 0 400 100" preserveAspectRatio="none"><defs><linearGradient id="wfT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbfdfd"/><stop offset=".25" stop-color="#e6f3f3"/><stop offset="1" stop-color="#c9dfe0"/></linearGradient></defs>
    <path d="M30 26Q30 16 44 16H356Q370 16 370 26V100H30Z" fill="url(#wfT)"/><path d="M36 18H364" stroke="#fff" stroke-width="3" stroke-linecap="round"/>${[1,2,3,4,5,6,7].map(i=>`<path d="M${30+i*42.5} 30V100" stroke="#b9d3d5" stroke-opacity=".6" stroke-width="1.4"/>`).join('')}<path d="M30 62H370" stroke="#b9d3d5" stroke-opacity=".6" stroke-width="1.4"/></svg>
    <div class="wf-steam"><i></i><i></i><i></i></div>`;
}
function setWater(pid){
  const st=$('#stage'),wf=$('#waterFront'),wb=$('#waterBack');if(!st||!wf)return;
  const kind=pid==='pool'?'pool':pid==='spa'?'spa':null;st.classList.toggle('in-water',!!kind);
  if(!kind){wf.className='';wf.innerHTML='';wf.removeAttribute('style');wf.dataset.k='';if(wb){wb.className='';wb.innerHTML=''}return}
  const sr=st.getBoundingClientRect(),mr=$('#mlgInner').getBoundingClientRect();
  if(kind==='pool'){
    const y=mr.top-sr.top+mr.height*.58;wf.removeAttribute('style');wf.style.top=Math.round(y)+'px';
    if(wf.dataset.k!=='pool'){wf.innerHTML=waterFrontSVG('pool');wf.dataset.k='pool'}
    wf.className='show k-pool';if(wb){wb.className='';wb.innerHTML=''}return;
  }
  // 목욕탕: 욕조 테두리 높이 = 말랑이 몸 60% 지점, 욕조 폭 = 말랑이 폭보다 넉넉하게
  const rim=mr.top-sr.top+mr.height*.74,cx=mr.left-sr.left+mr.width/2,half=Math.min(sr.width/2-6,mr.width*.82);
  const L=Math.round(cx-half),W=Math.round(half*2);
  wb.style.cssText=`left:${L}px;width:${W}px;top:${Math.round(rim-22)}px;height:40px`;
  wb.innerHTML=`<svg viewBox="0 0 200 40" preserveAspectRatio="none"><defs><linearGradient id="wbR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfeeee"/></linearGradient><radialGradient id="wbW" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#d4f6ef"/><stop offset="1" stop-color="#8fd6cb"/></radialGradient></defs>
    <ellipse cx="100" cy="22" rx="99" ry="17" fill="url(#wbR)"/><ellipse cx="100" cy="23" rx="91" ry="13" fill="url(#wbW)"/><ellipse cx="80" cy="19" rx="40" ry="3.5" fill="#fff" opacity=".45"/></svg>`;
  wb.className='show';
  wf.style.cssText=`left:${L}px;width:${W}px;top:${Math.round(rim)}px;right:auto`;
  wf.innerHTML=`<svg class="wf-ripple" viewBox="0 0 200 20" preserveAspectRatio="none"><path d="M10 6Q55 14 100 8T190 6" stroke="#fff" stroke-opacity=".8" stroke-width="2" fill="none"/><path d="M10 2Q55 12 100 4T190 2V10Q100 18 10 10Z" fill="#bff0e8" fill-opacity=".55"/></svg>
    <svg class="wf-tub2" viewBox="0 0 200 100" preserveAspectRatio="none"><defs><linearGradient id="wfT2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbfdfd"/><stop offset=".2" stop-color="#e8f4f4"/><stop offset="1" stop-color="#cde2e3"/></linearGradient></defs>
    <path d="M1 12Q1 4 12 4H188Q199 4 199 12V100H1Z" fill="url(#wfT2)"/><path d="M8 6H192" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>${[1,2,3,4,5].map(i=>`<path d="M${i*33.3} 16V100" stroke="#b9d3d5" stroke-opacity=".55" stroke-width="1"/>`).join('')}<path d="M1 54H199" stroke="#b9d3d5" stroke-opacity=".55" stroke-width="1"/></svg>
    <div class="wf-steam"><i></i><i></i><i></i></div>`;
  wf.dataset.k='spa';wf.className='show k-spa';
}

  speak(grumpy?talk('touchNo'):Math.random()<.4?pick(S.touch):talk('touch'),1300,grumpy?'say':'sh');
  if(!grumpy){hearts(3);setTimeout(()=>Sound.play('heart'),160);
    if(G.touches<CFG.touchAff&&G.phase==='plan'){G.touches++;applyDelta({aff:1,stress:-1},{quiet:true});save()}}
  clearTimeout(ui.faceT);ui.faceT=setTimeout(()=>{if(!ui.running&&!SQ.press)setFace(moodFace())},1300);
}
function idleLine(){
  const s=G.malang.stats,pool=[],m=G.malang,st=stageOf(Math.min(G.week,CFG.weeks)).id;
  const last=(m.story||[]).slice(-1)[0];
  if(st!=='baby'&&last&&last.npc&&NPCS[last.npc]&&G.week-last.w<=0&&Math.random()<.2)pool.push(`${jo(NPCS[last.npc].name,'이랑','랑')} 또 놀고 싶다.`);
  if(st!=='baby'&&G.week>=CFG.weeks-1)pool.push('벌써 이렇게 시간이 지났네.','조금 있으면 발표회야. 두근두근.');
  if(st!=='baby'&&G.week%4===0)pool.push('이번 주 끝나면 용돈 받는 날이다!');
  const owned=TOY_IDS.filter(k=>G.toys[k]);if(owned.length&&Math.random()<.35){const t=TOYS[pick(owned)].n;pool.push(`${jo(t,'이랑','랑')} 놀고 싶다.`)}
  if(s.stress>=70)pool.push(talk('idleStress'),talk('idleStress'));
  else if(s.stress>=50)pool.push(talk('idleTired'));
  if(s.weight>=CFG.chubby)pool.push(talk('idleChubby'));else if(s.weight<=CFG.skinny)pool.push(talk('idleSkinny'));
  if(s.aff<20)pool.push(talk('idleBored'));
  if(G.money<60)pool.push(pick(['지갑이 가벼워...','돈... 어디 갔지?']));
  const friends=metIds().filter(id=>G.malang.rel[id].aff>=40);
  if(friends.length&&Math.random()<.4){const f=NPCS[pick(friends)].name;pool.push(pick([`${f} 보고 싶다`,`${jo(f,'이랑','랑')} 또 놀고 싶어`,`${f}${jo(f,'은','는').slice(-1)} 지금 뭐 할까?`]))}
  if(G.malang.flags.cheeseRival&&!G.malang.flags.cheeseFriend)pool.push('치즈한텐 안 져...');
  if(toyCount()&&Math.random()<.3)pool.push(talk('idleBored'));
  if(!pool.length||Math.random()<.5)pool.push(talk('idleHappy'),talk('idleHappy'),talk('idleBored'));
  return pickFresh(pool);
}
function startRename(){
  if(ui.running)return;Sound.play('click');
  openOv(`<div class="ev-b rn-box"><div class="ev-t big">이름 바꾸기</div><p class="ev-p">${persona().adj} 성격의 ${spName(G.malang)} 말랑이예요. 새 이름을 지어 주세요. (최대 8글자)</p><input class="rn-in" id="nmIn" maxlength="8" value="${esc(G.malang.name)}" aria-label="이름" enterkeyhint="done" autocomplete="off"><div class="rn-btns"><button class="tbtn ghost" id="nmNo">취소</button><button class="tbtn" id="nmOk">${ic('check')}확인</button></div></div>`,'center');
  const inp=$('#nmIn');setTimeout(()=>{inp.focus();inp.select()},250);
  const done=()=>{const v=inp.value.trim().slice(0,8)||G.malang.name;G.malang.name=v;save();closeOv();renderHeader();speak(`${v}! 좋아!`,1300);Sound.play('good')};
  $('#nmOk').onclick=done;$('#nmNo').onclick=()=>{Sound.play('click');closeOv()};inp.addEventListener('keydown',e=>{if(e.key==='Enter')done()});
}

/* =========================================================
   시작
   ========================================================= */
function boot(){
  applyTheme();
  const loaded=load();G=loaded||newGame();
  initStats();ui.face=moodFace();ui.mode='home';
  setScenery('home',false);renderAll();updHz();addEventListener('resize',updHz);setTimeout(updHz,300);
  // 모바일 오디오: 실제 "사용자 활성화"로 인정되는 이벤트(터치 끝·클릭·키)에서 오디오를 깨운다
  ['pointerdown','pointerup','touchend','click','keydown'].forEach(t=>document.addEventListener(t,()=>Sound.unlock(),{capture:true,passive:true}));
  $('#mlgAnim').addEventListener('pointerdown',sqBegin);$('#stage').addEventListener('pointerdown',sqSecond);
  document.querySelectorAll('.stage-nav [data-open]').forEach(b=>b.onclick=()=>openPanel(b.dataset.open));
  $('#plate').onclick=startRename;$('#mirBtn').onclick=showMirror;
  setInterval(()=>{
    if(ui.running||!$('#ov').hidden||!$('#panel').hidden||$('#bubble').classList.contains('show'))return;
    if(ui.toyBusy||SQ.on)return;
    const owned=TOY_IDS.filter(k=>G.toys[k]);
    if(owned.length&&Math.random()<.12){playToy(pick(owned),true);return}
    if(Math.random()<.62)speak(idleLine(),1800,'mur');
  },5200);
  if(!loaded){save();showIntro()}
  else if(G.phase==='ending')resumeEnding();
}
boot();
})();

</script>
