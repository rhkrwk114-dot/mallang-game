<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>말랑이 키우기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efe7dc; --paper:#fffaf3; --paper2:#f6eee3; --ink:#3e3431; --sub:#8c7d72; --line:rgba(62,52,49,.12); --line2:rgba(62,52,49,.2);
  --berry:#e2577a; --berry-d:#b63c5c; --berry-t:#fde3ea; --jelly:#7cc86a; --jelly-d:#4f9a42; --butter:#f6c94c; --butter-d:#cf9f22;
  --track:#e8ddd0; --good:#3f9a58; --bad:#d9495c; --on-berry:#fff;
  --floor:#e7c8a2; --rug:#dbe5ef; --bubble:#fff;
  --lip:0 4px 0 rgba(62,52,49,.16);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1f1a1b; --paper:#2b2426; --paper2:#352d30; --ink:#f3ebe5; --sub:#ab9d95; --line:rgba(255,240,230,.1); --line2:rgba(255,240,230,.18);
    --berry:#ec7194; --berry-d:#a9405c; --berry-t:#4a2a36; --track:#40363a; --good:#7ccb8e; --bad:#f08b93; --bubble:#fffaf3;
    --lip:0 4px 0 rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#1f1a1b; --paper:#2b2426; --paper2:#352d30; --ink:#f3ebe5; --sub:#ab9d95; --line:rgba(255,240,230,.1); --line2:rgba(255,240,230,.18);
  --berry:#ec7194; --berry-d:#a9405c; --berry-t:#4a2a36; --track:#40363a; --good:#7ccb8e; --bad:#f08b93; --bubble:#fffaf3;
  --lip:0 4px 0 rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2.5px solid var(--berry);outline-offset:2px}
.cute{font-family:"Jua","Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-weight:400}
.sub{color:var(--sub);font-size:12.5px}
.ic{width:20px;height:20px;display:inline-block;vertical-align:middle;flex:none;overflow:visible}
.av{display:inline-block;width:26px;vertical-align:middle;flex:none}
.av svg{width:100%;display:block}

/* 장난감 버튼: 누르면 말랑하게 눌림 */
.tbtn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:54px;padding:0 20px;border-radius:20px;
  background:var(--berry);color:var(--on-berry);font-family:"Jua",sans-serif;font-size:19px;
  box-shadow:0 5px 0 var(--berry-d),inset 0 3px 0 rgba(255,255,255,.28),inset 0 -3px 0 rgba(0,0,0,.08);transition:transform .08s,box-shadow .08s}
.tbtn:active{transform:translateY(4px) scale(1.02,.96);box-shadow:0 1px 0 var(--berry-d),inset 0 3px 0 rgba(255,255,255,.2)}
.tbtn:disabled{filter:grayscale(.7);opacity:.45}
.tbtn .ic{width:22px;height:22px}
.tbtn.ghost{background:var(--paper);color:var(--ink);box-shadow:0 5px 0 var(--line2),inset 0 0 0 2px var(--line)}
.tbtn.ghost:active{box-shadow:0 1px 0 var(--line2),inset 0 0 0 2px var(--line)}
.tbtn.sq{width:54px;padding:0;flex:none}
.tbtn.wide{width:100%;margin-top:14px}
.tbtn.danger{background:var(--bad);box-shadow:0 5px 0 #9c2f3e}
.card{background:var(--paper);border-radius:24px;box-shadow:var(--lip),inset 0 0 0 2px var(--line)}

#app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;min-height:100%;padding-bottom:12px}

/* HUD */
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px 6px}
.plate{display:flex;align-items:center;gap:8px;min-width:0;padding:4px 14px 4px 4px;border-radius:999px;background:var(--paper);box-shadow:var(--lip),inset 0 0 0 2px var(--line);text-align:left}
.plate-av{width:42px;height:42px;border-radius:50%;background:var(--paper2);display:grid;place-items:center;overflow:hidden;flex:none}
.plate-av{padding:4px}
.plate-av svg{width:100%;height:100%;display:block;margin:0}
.plate-txt{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.plate-txt b{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate-txt small{font-size:11.5px;color:var(--sub);white-space:nowrap}
.coin{position:relative;display:flex;align-items:center;gap:6px;padding:6px 14px 6px 8px;border-radius:999px;background:#3e3431;color:#fff6dc;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.coin .ic{width:24px;height:24px}
.coin b{font-size:19px;font-variant-numeric:tabular-nums}
.coin .fl{right:8px;top:-8px}
.weekbar{display:flex;align-items:center;gap:10px;padding:2px 16px 8px}
.beads{display:flex;gap:4px;flex:1}
.beads i{flex:1;height:10px;border-radius:6px;background:var(--track);box-shadow:inset 0 -2px 0 rgba(0,0,0,.06)}
.beads i.on{background:var(--jelly);box-shadow:inset 0 -2px 0 var(--jelly-d)}
.beads i.now{background:var(--butter);box-shadow:inset 0 -2px 0 var(--butter-d);animation:bead 1.4s ease-in-out infinite}
@keyframes bead{50%{transform:scaleY(1.35)}}
.tend{display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:800;color:var(--berry);white-space:nowrap}
.tend .ic{width:16px;height:16px}

/* 무대 */
#stage{--sh:clamp(280px,47vh,440px);position:relative;height:var(--sh);margin:0 12px;border-radius:28px;overflow:hidden;background:#f6dcc0;
  box-shadow:var(--lip),inset 0 0 0 2px var(--line);transition:height .35s cubic-bezier(.3,1.2,.5,1);touch-action:none}
body.mode-plan #stage{--sh:clamp(170px,25vh,230px)}
body.mode-run #stage{--sh:clamp(260px,44vh,410px)}
#scenery{position:absolute;inset:0;transition:opacity .22s}
#scenery.fade{opacity:0}
.scene-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 60% 55% at 50% 72%,transparent 55%,rgba(40,25,20,.12))}
#mlg{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,calc(var(--sh) * 1.12));height:auto;aspect-ratio:260/200;overflow:visible;pointer-events:none;z-index:1}
#mlgAnim{pointer-events:visiblePainted;cursor:pointer;transform-box:fill-box;transform-origin:50% 100%}
.stage-nav{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:8px;z-index:3}
.rbtn{position:relative;width:42px;height:42px;border-radius:15px;background:var(--paper);display:grid;place-items:center;box-shadow:0 4px 0 rgba(62,52,49,.18),inset 0 0 0 2px var(--line);transition:transform .08s,box-shadow .08s}
.rbtn:active{transform:translateY(3px) scale(1.04,.94);box-shadow:0 1px 0 rgba(62,52,49,.18)}
.rbtn .ic{width:24px;height:24px}
.rbtn .dot{position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:50%;background:var(--berry);border:2px solid var(--paper)}
body.mode-run .stage-nav,body.mode-plan .stage-nav{display:none}
#placeTag{position:absolute;left:12px;top:12px;z-index:3;display:flex;align-items:center;gap:4px;padding:4px 12px 4px 6px;border-radius:12px;background:var(--paper);font-family:"Jua",sans-serif;font-size:15px;box-shadow:0 3px 0 rgba(62,52,49,.15);animation:tagin .3s cubic-bezier(.3,1.5,.6,1)}
#placeTag .ic{width:18px;height:18px}
@keyframes tagin{from{transform:translateY(-10px) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}

/* 말풍선: 외곽선 없이 부드러운 그림자 하나로 본체와 꼬리를 한 덩어리처럼 */
#bubble{--bb:#fffdf8;position:absolute;left:0;top:0;max-width:72%;padding:8px 15px 9px;border-radius:20px;background:var(--bb);color:#4b3f39;
  font-size:16px;line-height:1.35;text-align:center;white-space:normal;word-break:keep-all;z-index:4;pointer-events:none;opacity:0;
  transform-origin:var(--tail,50%) calc(100% + 12px);filter:drop-shadow(0 2px 0 rgba(62,52,49,.07)) drop-shadow(0 6px 12px rgba(62,52,49,.16))}
#bubble .bt i{font-style:normal;opacity:0;transition:opacity .12s}
#bubble .bt i.on{opacity:1}
#bubble .btail{position:absolute;left:var(--tail,50%);top:calc(100% - 1px);width:22px;height:13px;margin-left:-11px;overflow:visible}
#bubble .btail path{fill:var(--bb)}
#bubble .bdot{position:absolute;border-radius:50%;background:var(--bb)}
#bubble .bdot.d1{left:calc(var(--tail,50%) - 3px);top:calc(100% + 4px);width:9px;height:9px}
#bubble .bdot.d2{left:calc(var(--tail,50%) - 8px);top:calc(100% + 15px);width:5px;height:5px}
#bubble.show{animation:bubIn .38s cubic-bezier(.34,1.56,.64,1) forwards}
#bubble.hide{animation:bubOut .2s ease-in forwards}
#bubble.mur{--bb:#fbf6ee;color:#7a675d;font-size:14.5px;padding:7px 13px;border-radius:18px}
#bubble.sh{--bb:#fff2c2;font-size:18px}
#bubble.sh.show{animation:bubIn .38s cubic-bezier(.34,1.56,.64,1) forwards,bubHop .32s .38s ease-out 1}
@keyframes bubIn{0%{opacity:0;transform:translateY(8px) scale(.55)}60%{opacity:1;transform:translateY(-2px) scale(1.04)}100%{opacity:1;transform:none}}
@keyframes bubOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(4px) scale(.85)}}
@keyframes bubHop{0%,100%{transform:none}40%{transform:translateY(-3px) rotate(-1.5deg)}}
#prop{position:absolute;width:44px;height:44px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:2}
#prop .ic{width:100%;height:100%}
#prop.show{opacity:1;animation:bob 1s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
#peek{position:absolute;left:1%;bottom:4%;width:30%;opacity:0;transform:translateX(-40px);transition:opacity .3s,transform .4s cubic-bezier(.3,1.5,.6,1);pointer-events:none;z-index:1}
#peek.show{opacity:1;transform:none}
#fx{position:absolute;inset:0;pointer-events:none;z-index:4}
.heart{position:absolute;top:42%;width:22px;height:22px;animation:heart 1.3s ease-out forwards}
.heart .ic{width:100%;height:100%}
@keyframes heart{0%{opacity:0;transform:translateY(0) scale(.4)}20%{opacity:1;transform:translateY(-10px) scale(1)}100%{opacity:0;transform:translateY(-74px) scale(.9) rotate(12deg)}}
#toast{position:absolute;left:50%;bottom:12px;transform:translate(-50%,8px);display:flex;align-items:center;gap:6px;padding:6px 12px 6px 6px;border-radius:14px;background:var(--paper);color:var(--ink);
  font-size:13px;font-weight:700;white-space:nowrap;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:92%;overflow:hidden;text-overflow:ellipsis;z-index:4;box-shadow:0 3px 0 rgba(62,52,49,.15)}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* 말랑이 애니메이션 */
.eye{animation:blink 4.4s infinite;transform-box:fill-box;transform-origin:center}
.chomp{animation:chomp .3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sweat{animation:drip 1s ease-in infinite}
.a-idle{animation:breathe 2.8s ease-in-out infinite}
.a-squish{animation:squish .62s ease-out}
.a-bounce{animation:bounce .52s ease-in-out infinite}
.a-study{animation:study 1.3s ease-in-out infinite}
.a-hop{animation:hop .66s ease-in-out infinite}
.a-work{animation:work .7s ease-in-out infinite}
.a-sleep{animation:sleepy 2.2s ease-in-out infinite}
.a-shake{animation:shake .3s linear infinite}
.a-eat{animation:eat .32s ease-in-out infinite}
#mlgAnim.a-none{animation:none}
.a-jiggle{animation:jiggle 2.4s ease-in-out infinite}
.a-sag{animation:sag 3.6s ease-in-out infinite}
.a-slow{animation:breathe 4.4s ease-in-out infinite}
.a-melt{animation:melt 3.8s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.035,.955)}}
@keyframes squish{0%{transform:scale(1,1)}18%{transform:scale(1.24,.72)}40%{transform:scale(.88,1.15)}60%{transform:scale(1.08,.94)}80%{transform:scale(.97,1.03)}100%{transform:scale(1,1)}}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1.15,.84)}30%{transform:translateY(-8px) scale(.93,1.09)}55%{transform:translateY(-28px) scale(.96,1.04)}82%{transform:translateY(-4px) scale(1,1)}}
@keyframes study{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg) scale(1.02,.97)}}
@keyframes hop{0%,50%,100%{transform:translateY(0) scale(1.08,.92)}25%{transform:translateY(-16px) rotate(-7deg) scale(.95,1.05)}75%{transform:translateY(-16px) rotate(7deg) scale(.95,1.05)}}
@keyframes work{0%,100%{transform:translateX(-4px) rotate(-3deg)}50%{transform:translateX(4px) rotate(3deg) scale(1.02,.97)}}
@keyframes sleepy{0%,100%{transform:scale(1.06,.9)}50%{transform:scale(1.11,.85)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes eat{0%,100%{transform:scale(1,1)}50%{transform:scale(1.05,.95)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
@keyframes chomp{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.3)}}
@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(5px);opacity:.2}}
@keyframes jiggle{0%,100%{transform:skewX(0) scale(1,1)}15%{transform:skewX(2.5deg) scale(1.02,.98)}30%{transform:skewX(-2deg)}45%{transform:skewX(1.2deg) scale(1.01,.99)}60%{transform:skewX(-.6deg)}75%{transform:skewX(0)}}
@keyframes sag{0%,100%{transform:scale(1,1)}50%{transform:scale(1.06,.92)}}
@keyframes melt{0%,100%{transform:scale(1,1)}50%{transform:scale(1.04,.95) skewX(1deg)}}
.slime .sb{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 2.6s ease-in-out infinite}
.slime .sb.i-jiggle{animation:jiggle 2.4s ease-in-out infinite}
.slime .sb.i-sag{animation:sag 3.6s ease-in-out infinite}
.slime .sb.i-slow{animation-duration:4.4s}
.slime .sb.i-melt{animation:melt 3.8s ease-in-out infinite}
/* 배경 생활 연출 */
.amb-cloud{animation:cloud 22s linear infinite}
@keyframes cloud{0%{transform:translateX(-30px)}50%{transform:translateX(30px)}100%{transform:translateX(-30px)}}
.amb-sway{animation:sway 4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.amb-spin{animation:spin 8s linear infinite}.amb-spin.rev{animation-direction:reverse;animation-duration:6s}
@keyframes spin{to{transform:rotate(360deg)}}
.amb-wave{animation:wave 3s ease-in-out infinite}
@keyframes wave{0%,100%{transform:translateX(0)}50%{transform:translateX(-20px)}}
.amb-steam{animation:steam 2.6s ease-in-out infinite}
@keyframes steam{0%{transform:translateY(6px);opacity:0}40%{opacity:.9}100%{transform:translateY(-14px);opacity:0}}
.amb-blink{animation:ablink 2.2s ease-in-out infinite}
@keyframes ablink{0%,100%{opacity:1}50%{opacity:.45}}
.amb-glow{animation:ablink 3.4s ease-in-out infinite}

/* 트레이 */
#tray{display:flex;flex-direction:column;gap:10px;margin:12px 12px 0}
.m-home,.m-plan,.m-run{display:none!important}
body.mode-home .m-home,body.mode-plan .m-plan,body.mode-run .m-run{display:flex!important}

/* 능력치 카드 */
#statsCard{padding:12px 14px 8px;flex-direction:column;gap:6px}
.core{display:flex;flex-direction:column;gap:9px}
.cr{position:relative;display:grid;grid-template-columns:22px 58px 1fr 66px;align-items:center;gap:6px}
.cr .ic{width:22px;height:22px}.cr .l{font-weight:800;font-size:13px}
.cr>b{text-align:right;font-family:"Jua",sans-serif;font-weight:400;font-size:15px;white-space:nowrap}
.cr>b em{font-style:normal;font-size:11px;color:var(--sub);margin-left:3px;font-family:inherit}
.cbar{height:14px;border-radius:8px;background:var(--track);position:relative;overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.06)}
.cbar i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;transition:width .45s cubic-bezier(.3,1.3,.5,1),background .3s;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12),inset 0 3px 0 rgba(255,255,255,.35)}
.wgauge{height:14px;border-radius:8px;position:relative;background:linear-gradient(90deg,#9fc3ec 0 7%,#9edc86 7% 50%,#f6c27a 50% 71%,#ef8f8f 71%);box-shadow:inset 0 2px 0 rgba(0,0,0,.08)}
.wgauge .knob{position:absolute;top:50%;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid #3e3431;transform:translate(-50%,-50%);transition:left .45s cubic-bezier(.3,1.4,.5,1)}
.abtog{display:flex;align-items:center;gap:6px;padding:9px 2px 3px;margin-top:3px;border-top:2px dashed var(--line);font-weight:800;font-size:13.5px;width:100%}
.abtog .ic{width:18px;height:18px}
.abt-s{flex:1;text-align:right;color:var(--sub);font-size:12.5px;font-weight:700}
.chev .ic{transform:rotate(-90deg);transition:transform .25s}
#statsCard.open .chev .ic{transform:rotate(90deg)}
.abody{display:none;flex-direction:column;align-items:center;gap:2px;padding-bottom:4px}
#statsCard.open .abody{display:flex;animation:lgin .25s ease-out}
body.mode-run .abtog,body.mode-run .abody{display:none!important}
.spop{position:absolute;display:flex;align-items:center;gap:3px;padding:3px 9px 3px 4px;border-radius:999px;background:var(--paper);font-family:"Jua",sans-serif;font-size:13.5px;box-shadow:0 3px 0 rgba(62,52,49,.18);white-space:nowrap;animation:spop 1.4s ease-out forwards;z-index:5}
.spop .ic{width:18px;height:18px}.spop.up{color:var(--good)}.spop.down{color:var(--bad)}.spop.neu{color:var(--sub)}
@keyframes spop{0%{opacity:0;transform:translate(-50%,8px) scale(.5)}15%{opacity:1;transform:translate(-50%,-4px) scale(1.12)}100%{opacity:0;transform:translate(-50%,-44px)}}
.crumb{position:absolute;width:6px;height:5px;border-radius:2px;animation:crumb .7s ease-out forwards;z-index:4}
@keyframes crumb{to{transform:translate(var(--dx),var(--dy)) rotate(200deg);opacity:0}}
#toyPlay{position:absolute;left:68%;bottom:9%;width:17%;z-index:2;opacity:0;transform:translate(-50%,0);pointer-events:none}
#toyPlay.show{opacity:1}#toyPlay.hide{opacity:0;transition:opacity .3s}
#toyPlay svg{width:100%;display:block;overflow:visible}
.tp-in{animation:tpIn .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes tpIn{0%{transform:translate(-50%,-150px) rotate(-30deg)}70%{transform:translate(-50%,8px) scale(1.1,.85)}100%{transform:translate(-50%,0)}}
.tp-bounce{animation:tpBounce .8s ease-in-out infinite}
@keyframes tpBounce{0%,100%{transform:translate(-50%,0)}25%{transform:translate(-110%,-80px) rotate(-90deg)}50%{transform:translate(-160%,-20px) rotate(-180deg)}75%{transform:translate(-110%,-80px) rotate(-270deg)}}
.tp-hug{animation:tpHug .9s ease-in-out infinite}
@keyframes tpHug{0%,100%{transform:translate(-95%,0) scale(1)}50%{transform:translate(-100%,2px) scale(1.12,.88)}}
.tp-press{animation:tpPress .19s ease-in-out infinite}
@keyframes tpPress{50%{transform:translate(-50%,3px) scale(1.14,.84)}}
.tp-munch{animation:tpMunch .35s ease-in-out infinite}
@keyframes tpMunch{0%,100%{transform:translate(-130%,-55px) scale(.9)}50%{transform:translate(-135%,-50px) scale(.72,.84)}}
.tp-wear{transition:left .5s cubic-bezier(.3,1.4,.5,1),bottom .5s cubic-bezier(.3,1.4,.5,1);width:13%}
.tp-wear svg{animation:wob .9s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(9deg)}}
.tp-stretch{animation:tpStretch 1s ease-in-out infinite}
@keyframes tpStretch{0%,100%{transform:translate(-90%,0) scale(1,1)}50%{transform:translate(-90%,-10px) scale(.7,1.6)}}
.tp-gaze{animation:tpGaze 1.6s ease-in-out infinite}
@keyframes tpGaze{0%,100%{transform:translate(-80%,-60px);filter:drop-shadow(0 0 0 #fff6b0)}50%{transform:translate(-80%,-70px);filter:drop-shadow(0 0 10px #fff6b0)}}
#mlgAnim.a-stretchy{animation:stretchy 1s ease-in-out infinite}

.rare{display:inline-block;background:linear-gradient(90deg,#ffd6f0,#c9b6f2,#a8d8f0);color:#3e3431;font-weight:800;padding:3px 12px;border-radius:999px;font-size:13px}

/* 챕터 · 특별 이벤트 */
.beads i.chp{height:14px;border-radius:7px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.08),0 0 0 2px var(--butter)}
.tbadge{position:absolute;top:-8px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--paper);display:grid;place-items:center;box-shadow:0 2px 0 rgba(62,52,49,.2);animation:bob 1.4s ease-in-out infinite}
.tbadge .ic{width:16px!important;height:16px!important}
.ev-t.bigt{font-family:"Jua",sans-serif;font-weight:400;font-size:24px;color:var(--berry)}
.chap{margin-top:12px;padding:12px 14px;border-radius:18px;background:linear-gradient(135deg,#fff4dc,#ffe6ee);color:#3e3431;box-shadow:inset 0 0 0 2px rgba(246,201,76,.6)}
.chap .sub{color:#7a6a5e}
.chap-h{display:flex;align-items:center;gap:8px;margin-bottom:4px}.chap-h .ic{width:28px;height:28px}.chap-h b{font-size:17px;flex:1}

/* 장난감 */
.toy{display:block;width:100%;overflow:visible}
.toy.mini,.fxl .toy,.notes .toy,.lg-i .toy{width:28px!important;height:28px!important;flex:none;display:inline-block}
.etile.tt svg.toy{width:62%;margin:0 auto}
.etile.tt.r2{box-shadow:0 3px 0 rgba(62,52,49,.12),inset 0 0 0 2px #9fdcc0}
.etile.tt.r3{box-shadow:0 3px 0 rgba(62,52,49,.12),inset 0 0 0 2.5px #f6c94c;background:linear-gradient(#fffaf3,#fff4d6)}

.toyhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.toyhead .tbtn{height:46px;font-size:16px;padding:0 14px;white-space:nowrap;flex:none}
.set{padding:10px 12px;margin-bottom:8px}.set.done{box-shadow:var(--lip),inset 0 0 0 2.5px #f6c94c}
.set-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.set-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stoy{background:var(--paper2);border-radius:14px;padding:4px}.stoy.sil svg{filter:brightness(0);opacity:.15}
/* 뽑기 */
.mgame{padding:16px 16px 20px}
.mini-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.mini-h .cute{font-size:22px}
.claw-box{position:relative;height:240px;border-radius:22px;overflow:hidden;background:linear-gradient(#e7f5fb,#d2ecf6);box-shadow:inset 0 0 0 4px #3e3431,inset 0 0 0 9px #f28fb0}
.claw-top{position:absolute;left:9px;right:9px;top:9px;height:10px;background:#b8bec8;border-bottom:2px solid #3e3431}
.claw{position:absolute;top:18px;left:50%;width:46px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;z-index:2}
.claw .rope{display:block;width:3px;height:8px;background:#3e3431;transition:height .6s cubic-bezier(.4,0,.3,1)}
.claw .head{width:46px;display:block}.claw .head svg{width:100%;display:block}
.claw .held{width:40px;margin-top:-10px}
.ftoy{position:absolute;bottom:10px;width:15%;transform:translateX(-50%);transition:transform .2s}
.ftoy.slip{animation:slip .5s ease-out}
@keyframes slip{0%{transform:translate(-50%,-60px)}70%{transform:translate(-50%,6px) scale(1.15,.85)}100%{transform:translate(-50%,0)}}
.chute{position:absolute;right:9px;bottom:9px;width:15%;height:42px;background:#3e3431;color:#fff;border-radius:10px 10px 0 0;display:grid;place-items:center;font-family:"Jua",sans-serif;font-size:12px}
.mini-tip{text-align:center;margin:10px 0 0}
.got{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px;min-height:10px}
.gtoy{display:flex;flex-direction:column;align-items:center;width:70px;padding:4px;border-radius:14px;background:var(--paper2);animation:popin .5s cubic-bezier(.3,1.7,.5,1)}
.gtoy small{font-size:11px;font-weight:700}.gtoy.r3{background:#fff4d6}
/* 거래 */
.trade{padding:16px 14px 20px}
.tr-top{display:flex;gap:10px;align-items:center}
.tr-av{width:110px;flex:none}.tr-av svg{width:100%;display:block}
.tr-say{flex:1;background:var(--paper2);border-radius:18px;padding:10px 12px;position:relative}
.tr-say::before{content:"";position:absolute;left:-8px;top:24px;border:8px solid transparent;border-left:0;border-right-color:var(--paper2)}
.tr-say b{font-size:17px}.tr-say p{margin:2px 0 6px;font-size:14.5px;font-weight:700}
.tr-meter{display:flex;gap:4px}.tr-meter i{flex:1;height:9px;border-radius:5px;background:var(--track)}
.tr-meter i.on.l0,.tr-meter i.on.l1{background:#e98a8a}.tr-meter i.on.l2{background:#f6c94c}.tr-meter i.on.l3,.tr-meter i.on.l4{background:#7cc86a}
.tr-sec{font-family:"Jua",sans-serif;font-size:16px;margin:14px 2px 6px;display:flex;align-items:baseline;gap:8px}
.mat{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px;border-radius:18px;background:repeating-linear-gradient(45deg,#ffd6d6 0 12px,#fff3f3 12px 24px);box-shadow:inset 0 0 0 2px rgba(62,52,49,.12)}
.mine{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x mandatory}
.mtoy{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 2px;border-radius:14px;background:var(--paper);box-shadow:0 3px 0 rgba(62,52,49,.14),inset 0 0 0 2px var(--line);min-width:64px;scroll-snap-align:start}
.mtoy svg.toy{width:44px}.mtoy small{font-size:10px;font-weight:700;line-height:1.1;text-align:center}
.mtoy em{position:absolute;top:2px;right:4px;font-style:normal;font-size:10.5px;font-weight:800;color:var(--sub)}
.mtoy.r3{background:#fff4d6;color:#3e3431}.mtoy.on{box-shadow:0 3px 0 rgba(62,52,49,.14),inset 0 0 0 3px var(--berry);transform:translateY(-3px)}
.mtoy .chk{position:absolute;top:-6px;right:-4px;width:20px;height:20px;border-radius:50%;background:var(--berry);color:#fff;display:grid;place-items:center}
.mtoy .chk .ic{width:14px;height:14px}

/* =========================================================
   방 공간 + 반투명 유리 패널 (레퍼런스의 분위기만 참고)
   ========================================================= */
:root{
  --wall-a:#f3e6d5;--wall-b:#ead8c2;--floor-a:#e4cdb0;--floor-b:#d6b896;--beam:rgba(255,251,240,.55);--winglow:rgba(255,252,243,.85);
  --glass:rgba(255,251,246,.58);--glass-2:rgba(255,251,246,.38);--glass-line:rgba(255,255,255,.7);--glass-sh:0 10px 28px rgba(122,84,52,.13),0 2px 6px rgba(122,84,52,.06);
  --coral-a:#ffa69a;--coral-b:#f2708b;--rugA:#fffbf3;--rugB:#f1e6d6;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --wall-a:#3a2f2c;--wall-b:#2f2624;--floor-a:#3b2f28;--floor-b:#2d231e;--beam:rgba(255,214,160,.10);--winglow:rgba(176,196,236,.28);
  --glass:rgba(52,42,42,.58);--glass-2:rgba(52,42,42,.38);--glass-line:rgba(255,240,230,.14);--glass-sh:0 10px 28px rgba(0,0,0,.35);--rugA:#e9dfd2;--rugB:#cbbca9}}
:root[data-theme="dark"]{--wall-a:#3a2f2c;--wall-b:#2f2624;--floor-a:#3b2f28;--floor-b:#2d231e;--beam:rgba(255,214,160,.10);--winglow:rgba(176,196,236,.28);
  --glass:rgba(52,42,42,.58);--glass-2:rgba(52,42,42,.38);--glass-line:rgba(255,240,230,.14);--glass-sh:0 10px 28px rgba(0,0,0,.35);--rugA:#e9dfd2;--rugB:#cbbca9}
body{background:var(--floor-b)}
#app{position:relative;isolation:isolate;--hz:420px}
#room{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
#room .wall{position:absolute;left:0;right:0;top:0;height:var(--hz);transition:height .4s ease;
  background:radial-gradient(ellipse 70% 55% at 18% 22%,var(--winglow),transparent 60%),radial-gradient(ellipse 60% 40% at 85% 75%,rgba(255,236,210,.35),transparent 70%),linear-gradient(var(--wall-a),var(--wall-b))}
#room .win{position:absolute;left:6%;top:70px;width:30%;height:min(34vh,260px);border-radius:22px 22px 8px 8px;filter:blur(1.5px);opacity:.9;
  background:linear-gradient(170deg,var(--winglow),rgba(255,255,255,.12));box-shadow:inset 0 0 0 7px rgba(255,255,255,.28)}
#room .win::before,#room .win::after{content:"";position:absolute;background:rgba(255,255,255,.35)}
#room .win::before{left:50%;top:0;bottom:0;width:6px;margin-left:-3px}#room .win::after{top:46%;left:0;right:0;height:6px}
#room .beams{position:absolute;left:-10%;top:0;width:90%;height:var(--hz);opacity:.9;transition:height .4s ease;
  background:repeating-linear-gradient(118deg,transparent 0 46px,var(--beam) 46px 96px,transparent 96px 170px);
  -webkit-mask-image:linear-gradient(160deg,#000 10%,transparent 75%);mask-image:linear-gradient(160deg,#000 10%,transparent 75%);animation:beam 9s ease-in-out infinite alternate}
@keyframes beam{to{opacity:.55;transform:translateX(14px)}}
.amb-sway2{animation:beam 9s ease-in-out infinite alternate}
#room .trim{position:absolute;left:0;right:0;top:calc(var(--hz) - 10px);height:10px;background:linear-gradient(rgba(255,255,255,.25),rgba(120,80,50,.08));transition:top .4s ease}
#room .floor{position:absolute;left:0;right:0;top:var(--hz);bottom:0;transition:top .4s ease;overflow:hidden;
  background:radial-gradient(ellipse 60% 30% at 50% 0,rgba(255,248,236,.55),transparent 70%),linear-gradient(var(--floor-a),var(--floor-b))}
#room .floor::before{content:"";position:absolute;left:-60%;right:-60%;top:0;height:140%;transform-origin:50% 0;transform:perspective(260px) rotateX(58deg);
  background:repeating-linear-gradient(90deg,rgba(110,72,40,.10) 0 2px,transparent 2px 74px);opacity:.8}
#room .plant{position:absolute;right:5%;top:calc(var(--hz) - 118px);width:64px;height:118px;filter:blur(.6px);opacity:.92;transition:top .4s ease}
#room .vig{position:absolute;inset:0;background:radial-gradient(ellipse 80% 70% at 50% 40%,transparent 55%,rgba(90,58,34,.16))}

/* 무대: 박스를 없애고 방 안에 바로 선다 */
#stage{background:transparent!important;box-shadow:none!important;border-radius:0;margin:0 8px;overflow:visible}
#stage::after{display:none}
#scenery{border-radius:30px;overflow:hidden;-webkit-mask-image:radial-gradient(ellipse 78% 78% at 50% 48%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse 78% 78% at 50% 48%,#000 62%,transparent 100%)}
#stage.at-home #scenery{display:none}
#stage:not(.at-home) #mlgRug{display:none}
.rbtn{width:44px;height:44px;border-radius:50%;background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);box-shadow:var(--glass-sh),inset 0 1px 0 var(--glass-line)}
.rbtn:active{transform:scale(.92);box-shadow:var(--glass-sh)}
#placeTag{background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:999px;box-shadow:var(--glass-sh),inset 0 1px 0 var(--glass-line)}

/* HUD */
.plate,.coin{background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.2);backdrop-filter:blur(16px) saturate(1.2);box-shadow:var(--glass-sh),inset 0 1px 0 var(--glass-line);color:var(--ink)}
.coin{color:var(--ink)}
.plate-av{background:rgba(255,255,255,.55)}
.weekbar{justify-content:center;gap:10px;padding:2px 16px 4px;flex-wrap:wrap}
.weekbar .beads{flex:0 1 250px;padding:6px 8px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:var(--glass-sh),inset 0 1px 0 var(--glass-line)}
.beads i{height:8px;background:rgba(255,255,255,.55);box-shadow:inset 0 1px 2px rgba(110,72,40,.15)}
.beads i.on{background:linear-gradient(#ffc27a,#ff8f6a);box-shadow:inset 0 -2px 0 rgba(0,0,0,.08),inset 0 2px 0 rgba(255,255,255,.4)}
.beads i.now{background:linear-gradient(#fff0a8,#ffd25a)}
.beads i.chp{box-shadow:inset 0 1px 2px rgba(110,72,40,.15),0 0 0 2px rgba(255,210,90,.75)}
.tend{color:var(--ink);opacity:.8}
body.mode-plan .weekbar{display:none}

/* 유리 패널 공통 */
.card,.tile,.ctab,.scard,.sinfo,.ch,.etile,.tbtn.ghost,.mtoy{background:var(--glass)!important;-webkit-backdrop-filter:blur(16px) saturate(1.15);backdrop-filter:blur(16px) saturate(1.15);
  box-shadow:var(--glass-sh),inset 0 1px 0 var(--glass-line)!important}
.card{border-radius:26px}
.tile{border-radius:20px}
.tile:not(.empty){background:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.08)),var(--tc)!important}
.tile .td{opacity:.85}
.tile.sel,.tile.now{z-index:5;transform:scale(1.06);box-shadow:var(--glass-sh),0 0 0 3px #fff,0 0 0 6px rgba(242,112,139,.55)!important}
.tile{z-index:0}.strip{position:relative;z-index:2;overflow:visible;padding:6px 4px;margin:-6px -4px}
.scard.on,.sc4.on{z-index:4}
.ctab.on{background:linear-gradient(rgba(255,255,255,.4),rgba(255,255,255,.1)),var(--cc)!important;transform:translateY(1px)}
.scard{border-radius:22px}
.scard.on{box-shadow:var(--glass-sh),0 0 0 3px rgba(242,112,139,.6)!important}
.scard.lock{opacity:.85}
.sc-ic{box-shadow:inset 0 -3px 0 rgba(0,0,0,.06),inset 0 3px 0 rgba(255,255,255,.55),0 4px 10px rgba(122,84,52,.12)}
.sinfo{border-radius:20px}
.ch{border-radius:20px}
.ch.picked{background:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.2)),#ffd3dc!important}

/* 상태 바: 반짝이는 젤리 막대 */
.cbar,.bar{background:rgba(255,255,255,.5);box-shadow:inset 0 1px 3px rgba(110,72,40,.18)}
.cbar i,.bar i{box-shadow:inset 0 -3px 0 rgba(0,0,0,.08),inset 0 3px 0 rgba(255,255,255,.45)}
.wgauge{box-shadow:inset 0 1px 3px rgba(110,72,40,.2),0 0 0 3px rgba(255,255,255,.35)}
.abtog{border-top-color:rgba(255,255,255,.55)}

/* 버튼: 말캉한 코랄 젤리 */
.tbtn{background:linear-gradient(180deg,var(--coral-a),var(--coral-b));border-radius:24px;
  box-shadow:0 8px 20px rgba(242,112,139,.32),inset 0 2px 0 rgba(255,255,255,.55),inset 0 -4px 0 rgba(160,40,70,.15)}
.tbtn:active{transform:scale(.96,.92);box-shadow:0 3px 10px rgba(242,112,139,.3),inset 0 2px 0 rgba(255,255,255,.4)}
.tbtn.ghost{color:var(--ink)}

/* 하단 독: 아이콘이 버튼 위로 살짝 튀어나온 말랑한 버튼 */
.dock{display:grid;grid-template-columns:1fr 1.7fr 1fr;gap:10px;align-items:end;width:100%;padding-top:22px}
.dk{position:relative;height:74px;border-radius:30px 34px 28px 32px/30px 28px 34px 30px;background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.2);backdrop-filter:blur(16px) saturate(1.2);
  box-shadow:var(--glass-sh),inset 0 1px 0 var(--glass-line);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:12px;font-family:"Jua",sans-serif;font-size:15px;color:var(--ink);transition:transform .1s}
.dk:active{transform:scale(.95,.9)}
.dk .pop{position:absolute;top:-24px;left:50%;width:50px;height:50px;transform:translateX(-50%);filter:drop-shadow(0 6px 8px rgba(122,84,52,.25));animation:popbob 3s ease-in-out infinite}
.dk .pop .ic{width:100%;height:100%}
@keyframes popbob{50%{transform:translateX(-50%) translateY(-4px)}}
.dk.main{height:86px;background:linear-gradient(180deg,rgba(255,170,160,.9),rgba(242,112,139,.92));color:#fff;font-size:18px;box-shadow:0 12px 26px rgba(242,112,139,.35),inset 0 2px 0 rgba(255,255,255,.55),inset 0 -5px 0 rgba(160,40,70,.14)}
.dk.main .pop{top:-30px;width:60px;height:60px}
.dk.main small{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;font-size:11.5px;opacity:.9;font-weight:700;margin-top:1px}
.dk .dot{position:absolute;top:6px;right:16px;width:12px;height:12px;border-radius:50%;background:var(--berry);border:2px solid #fff}
.pop-glow{position:absolute;inset:-6px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.75),transparent 70%);z-index:-1}

/* 시트와 패널도 유리처럼 */
#ov{background:rgba(70,45,30,.28);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#ovCard{background:rgba(255,251,246,.9);-webkit-backdrop-filter:blur(22px) saturate(1.2);backdrop-filter:blur(22px) saturate(1.2);box-shadow:0 -10px 40px rgba(90,58,34,.18),inset 0 1px 0 rgba(255,255,255,.9)}
#panel{background:linear-gradient(var(--wall-a),var(--floor-b))}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #ovCard{background:rgba(44,36,38,.92)}}
:root[data-theme="dark"] #ovCard{background:rgba(44,36,38,.92)}

.psn{margin-top:12px;padding:12px 14px;border-radius:18px;background:linear-gradient(135deg,#fff4dc,#ffe6ee);color:#3e3431;display:flex;flex-direction:column;gap:3px;text-align:center}
.psn b{font-size:18px}.psn .sub{color:#7a6a5e}
#tray{margin-top:4px}
/* 도감 */
.etile.sp{position:relative;cursor:pointer;transition:transform .12s}
.etile.sp:active{transform:scale(.95)}
.etile .no{position:absolute;left:8px;top:6px;font-family:"Jua",sans-serif;font-size:11px;color:var(--sub);opacity:.8}
.etile .newb{position:absolute;right:6px;top:6px;font-style:normal;font-size:10px;font-weight:900;color:#fff;background:var(--coral-b,#f2708b);padding:1px 6px;border-radius:999px;animation:bob 1.4s ease-in-out infinite}
.etile .shb{position:absolute;right:6px;bottom:30px}.etile .shb .ic{width:16px;height:16px}
.etile.seen svg.slime{filter:saturate(.35) brightness(1.05);opacity:.75}
.dexhead{display:flex;align-items:center;gap:14px}
.ring{--p:0;flex:none;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#f2708b calc(var(--p)*1%),rgba(255,255,255,.55) 0);position:relative}
.ring::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--paper)}
.ring b{position:relative;font-size:16px}
.showcase .sc-stage{position:relative;height:270px;overflow:hidden;border-radius:30px 30px 0 0;background:radial-gradient(circle at 50% 42%,#fffaf0 0,#fbe9d4 45%,#efd2b4 100%)}
.sc-stage.shiny{background:radial-gradient(circle at 50% 42%,#fffaf3 0,#f3e4ff 45%,#d9c8f2 100%)}
.sc-rays{position:absolute;left:50%;top:44%;width:620px;height:620px;margin:-310px 0 0 -310px;background:repeating-conic-gradient(rgba(255,255,255,.55) 0 8deg,rgba(255,255,255,0) 8deg 22deg);animation:spin 40s linear infinite;-webkit-mask-image:radial-gradient(circle,#000 20%,transparent 62%);mask-image:radial-gradient(circle,#000 20%,transparent 62%)}
.sc-rug{position:absolute;left:50%;bottom:22px;width:72%;height:44px;margin-left:-36%;border-radius:50%;background:radial-gradient(ellipse,#fffdf6 0,#f6ead9 70%,rgba(246,234,217,0) 72%);box-shadow:0 6px 18px rgba(122,84,52,.12)}
.sc-stage .spk{position:absolute;width:28px;height:28px;animation:bob 1.6s ease-in-out infinite;z-index:2}
.sc-stage .spk .ic{width:100%;height:100%}
.sc-mal{position:absolute;left:50%;bottom:14px;width:74%;transform:translateX(-50%);padding:0;transform-origin:50% 100%}
.sc-mal .jmp{animation:jmpFloat 3.2s ease-in-out infinite}
.sc-mal svg{width:100%;display:block}
.sc-mal.boing{animation:scBoing .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes scFloat{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-6px)}}
@keyframes scBoing{0%{transform:translateX(-50%) scale(1,1)}25%{transform:translateX(-50%) scale(1.18,.78)}55%{transform:translateX(-50%) scale(.92,1.1)}100%{transform:translateX(-50%) scale(1,1)}}
.sc-no{position:absolute;left:16px;top:14px;font-size:15px;color:#a8794e;background:rgba(255,255,255,.6);padding:3px 10px;border-radius:999px}

const RECENT=[];
function pickFresh(pool){if(!pool||!pool.length)return null;for(let i=0;i<5;i++){const l=pick(pool);if(!RECENT.includes(l)){RECENT.push(l);if(RECENT.length>10)RECENT.shift();return l}}return pick(pool)}
function sitLine(sub){const st=stageOf(Math.min(G.week,CFG.weeks)).id;if(st==='baby')return null;return pickFresh(SIT[sub])}
function talk(key,vars){
  const st=stageOf(Math.min(G.week,CFG.weeks)).id,P=persona(),bp=st==='baby'&&BABY_P[G.malang.persona];
  const sl=(LINES[st]&&LINES[st][key])||null,gl=st==='baby'?null:GEN[key],pl=bp?(bp[key]||null):(P.L&&P.L[key])||null;
  // 성격 전용 대사는 가끔만(아기는 조금 더 자주), 대부분은 단계·상황 풀에서
  const pr={baby:.25,kid:.14,teen:.12,adult:.12}[st]||.12;let pool;
  const r=Math.random();
  if(pl&&r<pr)pool=pl;else if(sl&&gl)pool=Math.random()<.5?sl:gl;else pool=sl||gl||pl||LINES.kid[key]||['...'];
  let line=pickFresh(pool)||'...';
  if(vars&&vars.n)line=line.replace(/\{n\}/g,vars.n);else line=line.replace(/,?\s?\{n\}/g,'');
  if(P.tic&&!line.includes(P.tic)&&Math.random()<({baby:.1,kid:.1,teen:.07,adult:.06}[st]||.07))line=addTic(line,P.tic);
  return line;
}

function isUnlocked(id,m,w){m=m||G.malang;w=w||G.week;const A=SUBS[id];try{return !A.lock||!!A.lock.ok(m.stats,m,w)}catch(e){return false}}
function subTags(id){
  const A=SUBS[id],t=[];
  for(const k in A.gain||{})t.push(['up',STATS[k].n+(A.gain[k]>=3?' 쑥':'')]);
  for(const k in A.side||{})t.push([A.side[k]>0?'up':'bad',STATS[k].n+(A.side[k]>0?' 조금':' 떨어짐')]);
  if(A.aff)t.push(['up','친밀도']);
  if(A.friend)t.push(['up','친구와 가까워짐']);
  if(A.pay)t.push(['up',A.pay({int:0,str:0,cha:0})>=80?'돈 많이':'돈 벌기']);
  const st=A.stress||0;
  if(st<=-20)t.push(['up','푹 쉼']);else if(st<0)t.push(['up','스트레스 풀림']);
  else if(st>=12)t.push(['bad','많이 지쳐요']);else if(st>=6)t.push(['bad','지쳐요']);else if(st>0)t.push(['bad','조금 지쳐요']);
  if((A.w||0)<=-.3)t.push(['up','살 빠짐']);else if((A.w||0)>=.1)t.push(['bad','살 찔 수도']);
  if(A.cost)t.push(['bad',A.cost>=30?'돈 많이 들어요':A.cost>=20?'돈 들어요':'돈 조금']);
  return t;
}

/* =========================================================
   장소 배경: 장난감 디오라마 스타일의 작은 방/거리 (400×400, 바닥은 y≈318부터)
   가운데(x 140~260)는 말랑이 자리라서 비워 둔다
   ========================================================= */
let ARTID=0;
const OL='stroke="#5b4a43" stroke-opacity=".5" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"';
const Rc=(x,y,w,h,r,f,ex='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${f}" ${OL} ${ex}/>`;
const Ci=(x,y,r,f,ex='')=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" ${OL} ${ex}/>`;
const El=(x,y,rx,ry,f,ex='')=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${f}" ${OL} ${ex}/>`;
const Pt=(d,f,ex='')=>`<path d="${d}" fill="${f}" ${OL} ${ex}/>`;
const Ln=(d,c='#5b4a43',w=2.4,o=.5)=>`<path d="${d}" fill="none" stroke="${c}" stroke-opacity="${o}" stroke-width="${w}" stroke-linecap="round"/>`;
const A={
  wall(c1,c2,dots){const id='w'+(++ARTID);return `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient>${dots?`<pattern id="${id}p" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.2" fill="${dots}"/><circle cx="19" cy="19" r="2.2" fill="${dots}"/></pattern>`:''}</defs><rect width="400" height="322" fill="url(#${id})"/>${dots?`<rect width="400" height="322" fill="url(#${id}p)"/>`:''}`},
  stripes(c){let s='';for(let x=0;x<400;x+=36)s+=`<rect x="${x}" y="0" width="16" height="322" fill="${c}"/>`;return s},
  base(c){return `<rect x="0" y="306" width="400" height="16" fill="${c}"/><path d="M0 306h400" stroke="#5b4a43" stroke-opacity=".35" stroke-width="2"/>`},
  wood(c,l){return `<rect x="0" y="320" width="400" height="80" fill="${c}"/>${[338,360,384].map((y,i)=>Ln(`M0 ${y}H400`,l,2,.35)).join('')}${[[60,320,338],[230,320,338],[140,338,360],[320,338,360],[40,360,384],[270,360,384],[160,384,400]].map(([x,a,b])=>Ln(`M${x} ${a}V${b}`,l,2,.3)).join('')}`},
  tiles(c,l,step=40){let s=`<rect x="0" y="320" width="400" height="80" fill="${c}"/>`;for(let x=step;x<400;x+=step)s+=Ln(`M${x} 320L${x+(x-200)*.25} 400`,l,2,.3);s+=Ln('M0 350H400',l,2,.3)+Ln('M0 378H400',l,2,.3);return s},
  grass(c,c2){let s=`<rect x="0" y="318" width="400" height="82" fill="${c}"/>`;[[30,340],[90,372],[300,348],[360,380],[200,392],[130,350],[260,376]].forEach(([x,y])=>s+=Ln(`M${x} ${y}l-4-8M${x} ${y}l0-10M${x} ${y}l4-8`,c2,2.2,.8));return s},
  sky(c1,c2){const id='s'+(++ARTID);return `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="400" height="330" fill="url(#${id})"/>`},
  cloud(x,y,s=1){return `<g class="amb-cloud" style="animation-duration:${18+x%7*3}s" opacity=".95"><rect x="${x}" y="${y}" width="${70*s}" height="${20*s}" rx="${10*s}" fill="#fff"/><circle cx="${x+22*s}" cy="${y+2*s}" r="${14*s}" fill="#fff"/><circle cx="${x+44*s}" cy="${y}" r="${18*s}" fill="#fff"/></g>`},
  hills(c){return Pt('M-10 330C40 280 100 280 150 318S260 270 330 300 420 300 420 300V340H-10Z',c)},
  sun(x,y){return `<g class="amb-sway">${Ci(x,y,22,'#ffd76a')}</g>`},
  win(x,y,w,h,sky='#cfe6f3',cur){const mid=x+w/2;return `${Rc(x-6,y-6,w+12,h+12,10,'#fff6ea')}${Rc(x,y,w,h,6,sky)}${A.cloudIn(x,y,w)}${Ln(`M${mid} ${y}V${y+h}M${x} ${y+h/2}H${x+w}`,'#fff6ea',6,1)}${Rc(x-12,y+h+4,w+24,10,4,'#f3e3cf')}${cur?Pt(`M${x-10} ${y-8}h${w*.3}c-6 ${h*.5} 0 ${h} 6 ${h+14}h-${w*.3+8}z`,cur)+Pt(`M${x+w+10} ${y-8}h-${w*.3}c6 ${h*.5} 0 ${h} -6 ${h+14}h${w*.3+8}z`,cur):''}`},
  cloudIn(x,y,w){return `<ellipse cx="${x+w*.3}" cy="${y+20}" rx="${w*.14}" ry="7" fill="#fff" opacity=".8"/>`},
  shelf(x,y,w,rows=2,cols){let s='';const C=cols||['#e98fae','#8fa8ee','#f2c94c','#7fcfb9','#c9a7ec','#f0a070'];for(let r=0;r<rows;r++){const yy=y+r*46;let bx=x+6,i=r*3;while(bx<x+w-12){const bw=8+((i*7)%6),bh=26+((i*5)%12);s+=Rc(bx,yy+40-bh,bw,bh,2,C[i%C.length]);bx+=bw+2;i++}s+=Rc(x,yy+40,w,7,2,'#c99a6b')}return Rc(x-4,y-6,w+8,rows*46+12,6,'#e4c39d')+s},
  plant(x,y,s=1){return `${Pt(`M${x-14*s} ${y}h${28*s}l-${4*s} ${26*s}h-${20*s}z`,'#e48a6a')}<g class="amb-sway" style="transform-origin:${x}px ${y}px">${El(x-12*s,y-18*s,8*s,18*s,'#8fcf7c','transform="rotate(-25 '+(x-12*s)+' '+(y-18*s)+')"')}${El(x+12*s,y-20*s,8*s,18*s,'#7cc06a','transform="rotate(25 '+(x+12*s)+' '+(y-20*s)+')"')}${El(x,y-28*s,8*s,20*s,'#9edc86')}</g>`},
  frame(x,y,w,h,c='#f6c94c'){return Rc(x,y,w,h,4,c)+Rc(x+6,y+6,w-12,h-12,2,'#fff7e8')+`<path d="M${x+12} ${y+h-10}c0-${h*.35} ${w*.15}-${h*.5} ${w*.3}-${h*.5}s${w*.3} ${h*.15} ${w*.3} ${h*.5}z" fill="#9edc86"/>`},
  lamp(x,y){return Ln(`M${x} 0V${y-18}`)+`<g class="amb-glow"><ellipse cx="${x}" cy="${y+18}" rx="34" ry="14" fill="#fff3b0" opacity=".35"/></g>`+Pt(`M${x-18} ${y}l8-18h20l8 18z`,'#f6d27a')},
  rug(x,y,rx,ry,c){return El(x,y,rx,ry,c,'stroke-opacity=".25"')},
  sofa(x,y,w,c='#f2a6a0'){return Rc(x,y-36,w,30,12,c)+Rc(x-8,y-18,w+16,22,10,c)+Rc(x-12,y-30,16,34,8,c)+Rc(x+w-4,y-30,16,34,8,c)+Ln(`M${x} ${y+4}v8M${x+w} ${y+4}v8`)},
  table(x,y,w,c='#d9a877'){return Rc(x,y,w,10,4,c)+Ln(`M${x+8} ${y+10}V${y+44}M${x+w-8} ${y+10}V${y+44}`,'#5b4a43',4,.45)},
  counter(x,y,w,h,c,top='#fff6ea'){return Rc(x,y,w,h,6,c)+Rc(x-6,y-10,w+12,12,5,top)},
  bread(x,y,s=1,c='#e9b874'){return Pt(`M${x-14*s} ${y}c0-${12*s} ${6*s}-${16*s} ${14*s}-${16*s}s${14*s} ${4*s} ${14*s} ${16*s}z`,c)+Ln(`M${x-5*s} ${y-12*s}l2 ${5*s}M${x+3*s} ${y-13*s}l-1 ${6*s}`,'#5b4a43',1.8,.4)},
  tree(x,y,s=1,c='#8fcf7c'){return Ln(`M${x} ${y}V${y-46*s}`,'#8a6a52',10*s,1)+`<g class="amb-sway" style="transform-origin:${x}px ${y}px">${Ci(x,y-70*s,36*s,c)}${Ci(x-26*s,y-50*s,24*s,c)}${Ci(x+26*s,y-52*s,24*s,c)}</g>`},
  bush(x,y,s=1,c='#7cc06a'){return Pt(`M${x-30*s} ${y}c-6-${20*s} ${12*s}-${30*s} ${22*s}-${20*s}c4-${16*s} ${26*s}-${16*s} ${30*s} 0c${12*s}-${8*s} ${24*s} ${4*s} ${18*s} ${20*s}z`,c)},
  flower(x,y,c){return Ln(`M${x} ${y}v-14`,'#6fae5a',2,1)+Ci(x,y-16,4.5,c,'stroke-opacity=".3"')},
  bench(x,y,w){return Rc(x,y-26,w,8,3,'#d9a877')+Rc(x,y-12,w,8,3,'#d9a877')+Ln(`M${x+8} ${y-4}v8M${x+w-8} ${y-4}v8`,'#5b4a43',4,.5)},
  gear(x,y,r,c,rev){let d='';for(let i=0;i<8;i++){const a=i*Math.PI/4;d+=`<rect x="${x-r*.18}" y="${y-r-6}" width="${r*.36}" height="${12}" rx="2" fill="${c}" transform="rotate(${i*45} ${x} ${y})"/>`}return `<g class="amb-spin${rev?' rev':''}" style="transform-origin:${x}px ${y}px">${d}${Ci(x,y,r,c)}${Ci(x,y,r*.35,'#eef0f2')}</g>`},
  box(x,y,s,c='#e2b886'){return Rc(x,y-s,s,s,3,c)+Ln(`M${x} ${y-s*.6}H${x+s}`,'#5b4a43',2,.3)},
  easel(x,y){return Ln(`M${x} ${y}L${x+24} ${y-90}L${x+48} ${y}M${x+24} ${y-90}V${y}`,'#a8794e',5,1)+Rc(x+2,y-88,44,52,3,'#fffaf0')+`<path d="M${x+10} ${y-44}c4-14 12-18 18-10s10-2 10 10z" fill="#f5b7cf"/>`+Ci(x+34,y-74,5,'#f6c94c','stroke-opacity="0"')},
  splat(x,y,c,r=8){return `<g opacity=".8" fill="${c}"><circle cx="${x}" cy="${y}" r="${r}"/><circle cx="${x+r*.9}" cy="${y-r*.6}" r="${r*.45}"/><circle cx="${x-r*.8}" cy="${y+r*.7}" r="${r*.35}"/><circle cx="${x+r*1.3}" cy="${y+r*.8}" r="${r*.25}"/></g>`},
  scroll(x,y,h){return Rc(x-4,y-6,48,8,3,'#a8794e')+Rc(x,y,40,h,2,'#fff8ea')+Ln(`M${x+20} ${y+14}c-6 14 8 20 0 ${h-30}`,'#3e3431',5,.8)+Rc(x-4,y+h,48,8,3,'#a8794e')},
  lantern(x,y){return Ln(`M${x} 0V${y-24}`)+`<g class="amb-sway" style="transform-origin:${x}px 0px">${El(x,y,18,24,'#f2766c')}${Ln(`M${x-16} ${y-6}H${x+16}M${x-16} ${y+6}H${x+16}`,'#5b4a43',1.6,.4)}</g>`},
  water(c){return `<rect x="0" y="318" width="400" height="82" fill="${c}"/><g class="amb-wave">${[334,356,378].map(y=>`<path d="M-40 ${y}q20-8 40 0t40 0 40 0 40 0 40 0 40 0 40 0 40 0 40 0 40 0 40 0 40 0" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="3"/>`).join('')}</g>`},
  cab(x,y,c){return Rc(x,y-120,62,120,8,c)+`<g class="amb-blink">${Rc(x+8,y-108,46,36,4,'#2b2747')}<rect x="${x+14}" y="${y-100}" width="14" height="8" fill="#7ef0c0" opacity=".9"/><rect x="${x+32}" y="${y-88}" width="14" height="8" fill="#f2577a" opacity=".9"/></g>`+Rc(x+4,y-64,54,16,4,'#3a3460')+Ci(x+20,y-56,4,'#f2577a')+Ci(x+42,y-56,4,'#f7cf5a')},
  disco(x,y){return Ln(`M${x} 0V${y-22}`)+`<g class="amb-spin" style="transform-origin:${x}px ${y}px">${Ci(x,y,22,'#d9dbe8')}${Ln(`M${x-22} ${y}H${x+22}M${x} ${y-22}V${y+22}M${x-15} ${y-15}L${x+15} ${y+15}M${x+15} ${y-15}L${x-15} ${y+15}`,'#fff',2,.8)}</g>`},
  beam(x,c){return `<path class="amb-blink" d="M${x} 0L${x-60} 330H${x+60}Z" fill="${c}" opacity=".18"/>`},
  house(x,y,w,h,c,roof){return Rc(x,y-h,w,h,4,c)+Pt(`M${x-8} ${y-h}L${x+w/2} ${y-h-34}L${x+w+8} ${y-h}Z`,roof)+Rc(x+w*.32,y-h*.45,w*.36,h*.45,3,'#c99a6b')+Rc(x+w*.12,y-h*.82,w*.26,w*.22,3,'#cfe6f3')},
  post(x,y){return Ln(`M${x} ${y}V${y-150}`,'#5b4a43',5,.7)+`<g class="amb-glow">${Ci(x,y-158,12,'#fff3b0')}</g>`},
  fence(y,c='#f3e3cf'){let s='';for(let x=-10;x<410;x+=30)s+=Rc(x,y-50,20,52,6,c);return Rc(-10,y-36,420,8,3,c)+s},
  desk(x,y,w){return Rc(x,y-60,w,10,3,'#d9a877')+Rc(x+4,y-50,w*.4,50,3,'#e6bf8d')+Ln(`M${x+w-8} ${y-50}V${y}`,'#5b4a43',4,.45)},
  desklamp(x,y){return Ln(`M${x} ${y}l10-34l-16-14`,'#5b4a43',4,.6)+Pt(`M${x-24} ${y-46}l12-14 14 10z`,'#8fa8ee')+`<g class="amb-glow"><ellipse cx="${x-14}" cy="${y-20}" rx="22" ry="10" fill="#fff3b0" opacity=".4"/></g>`},
  bed(x,y,w){return Rc(x,y-40,w,32,10,'#c9d7f2')+Rc(x+6,y-56,40,22,9,'#fff')+Rc(x-6,y-70,14,72,5,'#d9a877')+Ln(`M${x+w-6} ${y-8}v10`,'#5b4a43',4,.5)},
  tub(x,y,w){return Rc(x,y-44,w,44,20,'#f6f8fa')+Rc(x+8,y-50,w-16,12,6,'#a6d3df')+`<g class="amb-steam">${Ln(`M${x+w*.3} ${y-58}c-8-10 8-16 0-28M${x+w*.55} ${y-58}c-8-10 8-16 0-28M${x+w*.8} ${y-58}c-8-10 8-16 0-28`,'#9fb7c4',3,.7)}</g>`},
  tilewall(c,l){let s=`<rect width="400" height="322" fill="${c}"/>`;for(let x=0;x<400;x+=32)s+=Ln(`M${x} 0V322`,l,1.6,.35);for(let y=0;y<322;y+=32)s+=Ln(`M0 ${y}H400`,l,1.6,.35);return s},
  coffee(x,y){return Rc(x,y-64,46,64,6,'#8a6a5a')+Rc(x+8,y-56,30,16,4,'#3e3431')+Ci(x+23,y-24,6,'#f2577a')+`<g class="amb-steam">${Ln(`M${x+58} ${y-20}c-6-8 6-12 0-22`,'#bfb2a8',3,.7)}</g>`+Rc(x+50,y-16,16,16,4,'#fff')},
  mat(x,y,w,c){return Rc(x,y-6,w,10,5,c,'stroke-opacity=".3"')},
  candle(x,y){return Rc(x-5,y-22,10,22,3,'#fff6ea')+`<g class="amb-blink">${El(x,y-30,4,7,'#ffcf5a','stroke-opacity="0"')}</g>`},

/* =========================================================
   장소 배경 v2: 기본 방과 같은 빛·재질·깊이로 통일한 2.5D 디오라마
   - 빛은 항상 왼쪽 위 창가에서, 바닥과 벽은 하나의 소실점(200,150)을 향한다
   - 외곽선 대신 면의 밝기 차이(윗면 밝게 / 옆면 어둡게)와 부드러운 그림자로 입체를 만든다
   ========================================================= */
let AD=[],AID=0;
const VP=[200,150];
function hexRGB(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return [0,2,4].map(i=>parseInt(h.substr(i,2),16))}
function mix(a,b,t){const A=hexRGB(a),B=hexRGB(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}
const LI=(c,t)=>mix(c,'#ffffff',t),DK=(c,t)=>mix(c,'#3a2418',t);
function lg(st,x2=0,y2=1){const id='p'+(++AID);AD.push(`<linearGradient id="${id}" x1="0" y1="0" x2="${x2}" y2="${y2}">${st.map(([o,c,op=1])=>`<stop offset="${o}" stop-color="${c}" stop-opacity="${op}"/>`).join('')}</linearGradient>`);return `url(#${id})`}
function rgr(st,cx=.5,cy=.5,r=.5){const id='p'+(++AID);AD.push(`<radialGradient id="${id}" cx="${cx}" cy="${cy}" r="${r}">${st.map(([o,c,op=1])=>`<stop offset="${o}" stop-color="${c}" stop-opacity="${op}"/>`).join('')}</radialGradient>`);return `url(#${id})`}
const f1=n=>(+n).toFixed(1);
function shd(x,y,rx,ry,o=.2){return `<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1(rx)}" ry="${f1(ry)}" fill="${rgr([[0,'#4a2c18',o],[1,'#4a2c18',0]])}"/>`}
function poly(pts,f){return `<path d="M${pts.map(p=>p.map(f1).join(' ')).join('L')}Z" fill="${f}" stroke="${f}" stroke-width="2.5" stroke-linejoin="round"/>`}
// 2.5D 상자: 소실점을 향해 윗면/옆면이 보인다
function bx(x,y,w,h,c,o={}){
  const k=o.k??.12,P=([px,py])=>[px+(VP[0]-px)*k,py+(VP[1]-py)*k];
  const FL=[x,y-h],FR=[x+w,y-h],BR=[x+w,y],BL=[x,y];
  let s=o.flat||o.wall?'':shd(x+w/2,y+3,w*.62+6,Math.max(5,w*.09),.22);
  if(!o.wall){const side=lg([[0,LI(c,.38)],[.18,LI(c,.12)],[1,DK(c,.3)]]),N=8,r0=o.r??5;
    for(let i=N;i>=1;i--){const sc=1-k*(i/N);s+=`<rect x="${f1(x)}" y="${f1(y-h)}" width="${f1(w)}" height="${f1(h)}" rx="${r0}" fill="${side}" transform="translate(${VP[0]} ${VP[1]}) scale(${sc.toFixed(4)}) translate(${-VP[0]} ${-VP[1]})"/>`}}
  s+=`<rect x="${f1(x)}" y="${f1(y-h)}" width="${f1(w)}" height="${f1(h)}" rx="${o.r??5}" fill="${lg([[0,LI(c,.14)],[.55,c],[1,DK(c,.1)]],1,0)}"/>`;
  s+=`<rect x="${f1(x)}" y="${f1(y-h)}" width="${f1(w)}" height="${f1(h)}" rx="${o.r??5}" fill="${lg([[0,'#fff',.18],[.25,'#fff',0],[.85,'#3a2418',0],[1,'#3a2418',.14]])}"/>`;
  return s;
}
function cyl(x,y,rx,h,c,o={}){const ry=rx*.3;
  return (o.noShadow?'':shd(x,y+2,rx*1.25,ry*1.3,.22))+`<path d="M${f1(x-rx)} ${f1(y-h)}V${f1(y)}A${f1(rx)} ${f1(ry)} 0 0 0 ${f1(x+rx)} ${f1(y)}V${f1(y-h)}Z" fill="${lg([[0,DK(c,.12)],[.3,LI(c,.22)],[.7,c],[1,DK(c,.22)]],1,0)}"/><ellipse cx="${f1(x)}" cy="${f1(y-h)}" rx="${f1(rx)}" ry="${f1(ry)}" fill="${LI(c,.32)}"/>`}
function ball(x,y,r,c,o={}){return (o.noShadow?'':shd(x,y+r*.95,r*1.1,r*.28,.24))+`<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r)}" fill="${rgr([[0,LI(c,.45)],[.55,c],[1,DK(c,.22)]],.35,.3,.75)}"/>`}
function glowC(x,y,r,c,o=.55,cls='amb-glow'){return `<g class="${cls}"><circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r)}" fill="${rgr([[0,c,o],[1,c,0]])}"/></g>`}
// 바닥 위 평면(돗자리·매트): 앞쪽 폭 w, 깊이 d
function fq(cx,cy,w,d,c,pat){const k=d/250,P=([px,py])=>[px+(VP[0]-px)*k,py+(VP[1]-py)*k];const NL=[cx-w/2,cy+d/2],NR=[cx+w/2,cy+d/2],FR=P(NR),FL=P(NL);
  return shd(cx,cy+d/2+2,w*.55,6,.16)+poly([NL,NR,FR,FL],c)+(pat||'')}
const W2={
  wall(c1,c2,o={}){return `<rect width="400" height="302" fill="${lg([[0,LI(c1,.05)],[1,c2]])}"/>`+(o.pat?o.pat:'')+`<rect width="400" height="302" fill="${rgr([[0,'#fffbef',.75],[1,'#fffbef',0]],.18,.2,.6)}"/>`+W2.beams()},
  beams(){return `<g class="amb-sway2" opacity=".55">${[0,1,2].map(i=>`<path d="M${-40+i*70} 0h40L${120+i*70} 300h-40z" fill="${lg([[0,'#fffaf0',.55],[1,'#fffaf0',0]])}"/>`).join('')}</g>`},
  dots(c){let s='';for(let y=18;y<300;y+=26)for(let x=(y/26%2)*13+10;x<400;x+=26)s+=`<circle cx="${x}" cy="${y}" r="2.2" fill="${c}"/>`;return s},

  // BGM: F장조 오르골 + 부드러운 베이스, 8마디 멜로디 → 8마디 쉬는 구간(반복해도 피곤하지 않게)
  const CH=[[53,57,60],[50,53,57],[46,50,53],[48,52,55]],PROG=[0,1,2,3,0,1,2,3];
  const MEL=[
    [[0,72,2],[2,69,2],[4,72,1],[5,74,1],[6,72,2]],
    [[0,69,3],[3,65,1],[4,67,2],[6,69,2]],

    [[0,77,2],[2,74,1],[3,72,1],[4,74,2],[6,72,2]],
    [[0,69,2],[2,74,2],[4,72,2],[6,69,2]],
    [[0,70,2],[2,69,2],[4,67,2],[6,65,2]],
    [[0,64,2],[2,67,2],[4,65,4]]
  ];
  const PENTA=[65,67,69,72,74,77],E=60/76/2;
  const bellB=(m,t,d,v)=>{tone(mtof(m),t,d,{vol:v,r:.6,dest:bg,abs:true});tone(mtof(m+12),t,d*.5,{vol:v*.22,r:.3,dest:bg,abs:true})};

  const S=SPECIES[species]||SPECIES.jelly;
  const m={id:'m'+Date.now().toString(36)+Math.floor(Math.random()*1e4),name:S.nick,gen,species,hue,genes:{species,hue},traits:[...traits],
    stats:{int:0,cul:0,art:0,mar:0,str:0,cha:0,aff:10,stress:10,weight:CFG.startWeight},

  for(const tid of traits){

function migrate(o){
  if(!o||!o.malang||!Array.isArray(o.schedule))return null;
  if(o.v===1){
    const m=o.malang;
    m.hist={study:0,exercise:0,play:0,work:0,rest:0,rebel:0};m.rel={};m.flags={};m.seenEv={};m.items=[];m.traits=[];
    o.dex={ev:{},end:{},npc:{}};(o.lineage||[]).forEach(l=>{l.traits=[]});o.v=2;
  }
  if(o.v!==2)return null;
  NPC_IDS.forEach(id=>{if(!o.malang.rel[id])o.malang.rel[id]=freshRel()});
  const mm=o.malang;if(!mm.species)mm.species='jelly';
  o.dex.sp=o.dex.sp||{};o.dex.sp[mm.species]='raised';
  (o.lineage||[]).forEach(l=>{l.species=l.species||'jelly';o.dex.sp[l.species]='raised'});
  ['cul','art','mar','cha','int','str'].forEach(k=>{if(mm.stats[k]==null)mm.stats[k]=0});
  const OLD={study:'acad',exercise:'jog',play:'park',work:'bakery',rest:'home'};
  o.schedule=o.schedule.map(a=>a&&!SUBS[a]?(OLD[a]||null):a);
  mm.sub=mm.sub||{};
  if(mm.persona==='grumpy')mm.persona='shy';(o.lineage||[]).forEach(l=>{if(l.persona==='grumpy')l.persona='shy'});
  if(!mm.persona||!PERSONA[mm.persona])mm.persona=rollPersona(mm.species);
  if(!mm.unl)mm.unl=SUB_IDS.filter(id=>isUnlocked(id,mm,o.week));
  if(!o.toys){o.toys={peach:1,bubble:1};o.toyDex={peach:1,bubble:1}}o.toyDex=o.toyDex||{};o.setsDone=o.setsDone||{};
  if(!o.chapSnap)o.chapSnap=Object.fromEntries(['int','cul','art','mar','str','cha'].map(k=>[k,mm.stats[k]||0]));
  // 친구를 만났다고 주인공 도감이 열리던 오류 정리: 직접 키운 종류만 남긴다
  for(const k of Object.keys(o.dex.sp||{}))if(o.dex.sp[k]!=='raised')delete o.dex.sp[k];
  if(o.malang&&o.malang.species)o.dex.sp[o.malang.species]='raised';
  (o.lineage||[]).forEach(l=>{o.dex.sp[l.species||'jelly']='raised'});
  if(o.phase==='run')o.phase='plan';
  return o;
}

/* ---------- 촉감놀이: 스프링으로 눌림·늘림·흔들림·복원 ----------
   누르기: 꾹 누를수록 깊게 눌림 / 위로 끌기: 늘리기(종류별 한계) / 좌우로 끌기: 흔들기
   놓으면 종류별 탄성(k)·감쇠(c)로 복원 → 젤리는 튕기고, 빵은 스르륵, 푸딩은 한참 흔들린다 */
/* ---------- 촉감놀이 v2: 재질마다 "조작감" 자체가 다르다 ----------
   elastic(젤리): 손가락을 따라 출렁이고, 톡톡 칠수록 텐션이 쌓여 크게 튕김
   jiggle(푸딩): 살짝만 건드려도 한참 흔들림
   sticky(찹쌀떡): 쭉 늘어나고, 놓아도 잠깐 붙어 있다가 천천히 퍼짐
   foam(마시멜로·빵): 누를수록 천천히 꺼지고, 놓으면 자국이 남았다가 스르륵 부풂
   melt(버터): 오래 쥘수록 녹아 퍼지고 손을 따라 미끄러짐
   crunch(크런치): 처음엔 단단히 버티다가 '바삭' 깨지는 순간 푹 눌리고, 놓으면 부르르 떪
   beads(알갱이): 움직일 때마다 알갱이가 달그락, 속이 한 박자 늦게 따라옴
   string(치즈): 쭈욱 늘어나다 한계에서 '툭' 끊기듯 튕겨 돌아옴 */
/* ---------- 촉감놀이 v3: 한 손가락 누르기 + 두 손가락 잡아 늘리기 ----------
   한 손가락: 재질별 누름(elastic/jiggle/sticky/foam/melt/crunch/beads/string)
   두 손가락: 양쪽을 잡고 벌리면 늘어나고(부피 보존으로 반대 방향은 얇아짐), 비틀면 살짝 꼬인다.
     재질마다 최대로 늘어나는 정도(pullMax), 복원 탄성(pk)·감쇠(pc)가 다르다.
     크런치는 조금만 당겨도 '바삭' 깨지며 튕기고, 치즈는 한계까지 쭉 늘어나다 '툭' 끊기고, 찹쌀떡·버터는 천천히 돌아온다 */
const SQ={d:0,v:0,sk:0,skv:0,tx:0,txv:0,ttx:0,tgt:0,dent:0,on:false,press:false,t0:0,sx:0,sy:0,px:0,py:0,last:0,stretched:false,rel:-9999,relD:0,cracked:false,shiver:0,lastSnd:0,move:0,taps:0,lastTap:0,dragged:false,
  pid:null,ptrs:new Map(),pull:false,pf:1,pv:0,pt:1,rot:0,rv:0,rt:0,axis:'x',d0:1,a0:0,pullSnd:0,pulled:false};
const HAPTIC={elastic:[10],jiggle:[6,30,6],sticky:[22],foam:[5],melt:[4],crunch:[5,12,5,12,12],beads:[4,8,4],string:[16]};
const PULL={jelly:{max:.55,pk:230,pc:8,tw:.6},pudding:{max:.32,pk:150,pc:4.5,tw:.8},mochi:{max:1.05,pk:45,pc:13,tw:.4},marsh:{max:.36,pk:60,pc:15,tw:.3},
  bread:{max:.2,pk:110,pc:18,tw:.2},bun:{max:.26,pk:100,pc:17,tw:.2},butter:{max:.65,pk:28,pc:15,tw:.5},crunch:{max:.07,pk:420,pc:24,tw:.1,crack:1.1},
  cheese:{max:1.15,pk:170,pc:10,tw:.3,snap:1},beads:{max:.45,pk:210,pc:11,tw:.5}};
function buzz(p){try{if(p&&navigator.vibrate)navigator.vibrate(p)}catch(e){}}

function startTick(){if(!SQ.on){SQ.on=true;$('#mlgAnim').setAttribute('class','a-none');SQ.last=performance.now();requestAnimationFrame(sqTick)}}
function sqTick(t){
  const g=$('#mlgAnim'),M=mat(),mode=M.mode||'elastic',S=SPECIES[G.malang.species],PU=pullOf();
  const dt=Math.min(.024,Math.max(.001,(t-SQ.last)/1000));SQ.last=t;
  const hold=t-SQ.t0;let k=M.k,c=M.c;
  if(SQ.press&&!SQ.pull&&!SQ.afterPull){
    if(SQ.tgt>=0||!SQ.stretched){
      switch(mode){
        case 'foam':SQ.tgt=M.squash*Math.min(1,.2+hold/700);k=M.k*2.4;break;
        case 'melt':SQ.tgt=M.squash*Math.min(1.7,.4+hold/1000);SQ.skv+=Math.sin(t/160)*7;if(t-SQ.lastSnd>420){SQ.lastSnd=t;Sound.feel(S.snd,'smear')}break;
        case 'crunch':if(!SQ.cracked&&hold>230){SQ.cracked=true;Sound.feel(S.snd,'press');buzz(HAPTIC.crunch);crumbs(8,S.pal?S.pal[1]:'#8fd0f6');SQ.v+=2.5}SQ.tgt=SQ.cracked?M.squash:M.squash*.12;k=SQ.cracked?M.k:M.k*1.6;break;
        case 'sticky':SQ.tgt=M.squash*(.7+.3*Math.min(1,hold/500));k=M.k*1.6;break;
        default:SQ.tgt=M.squash*(.6+.4*Math.min(1,hold/450));
      }
    }
  }else if(!SQ.press){
    if(mode==='sticky'&&t-SQ.rel<(M.stick||380)){SQ.tgt=SQ.relD;k=M.k*3;c=M.c*2}
    else SQ.tgt=mode==='foam'?SQ.dent:0;
    if(mode==='foam')SQ.dent=Math.max(0,SQ.dent-dt*.07);
    if(mode==='melt')k=M.k*.7;
  }else SQ.tgt=0;
  SQ.v+=(-k*(SQ.d-SQ.tgt)-c*SQ.v)*dt;SQ.d+=SQ.v*dt;
  SQ.txv+=(-M.k*.6*(SQ.tx-(SQ.press&&!SQ.pull?SQ.ttx:0))-Math.max(3,M.c*.7)*SQ.txv)*dt;SQ.tx+=SQ.txv*dt;
  SQ.skv+=(-M.k*.7*SQ.sk-Math.max(2,M.c*.5)*SQ.skv)*dt;SQ.sk=clamp(SQ.sk+SQ.skv*dt,-18,18);
  // 두 손가락 늘리기: 잡고 있을 땐 손가락을 빠르게 따라가고, 놓으면 재질별 탄성으로 복원
  // 잡고 있을 땐 손가락 목표값을 부드럽게 따라가고(지수 보간), 놓으면 잘게 나눈 스텝으로 스프링 복원 → 튐 방지
  if(SQ.pull){const a=1-Math.exp(-dt*20);SQ.pf+=(SQ.pt-SQ.pf)*a;SQ.rot+=(SQ.rt-SQ.rot)*a;SQ.pv=0;SQ.rv=0}
  else{const n=4,h=dt/n;for(let i=0;i<n;i++){SQ.pv+=(-PU.pk*(SQ.pf-1)-PU.pc*SQ.pv)*h;SQ.pf+=SQ.pv*h;SQ.rv+=(-PU.pk*SQ.rot-PU.pc*SQ.rv)*h;SQ.rot+=SQ.rv*h}}
  SQ.pf=clamp(SQ.pf,.65,2.3);SQ.rot=clamp(SQ.rot,-26,26);if(!isFinite(SQ.pf)){SQ.pf=1;SQ.pv=0}if(!isFinite(SQ.rot)){SQ.rot=0;SQ.rv=0}
  const shv=SQ.shiver>t?Math.sin(t/11)*2.4*((SQ.shiver-t)/280):0;
  const d=SQ.d;let sx=d>=0?1+d*M.spread:1+d*.5,sy=1-d;
  const pf=SQ.pf,inv=1/Math.sqrt(Math.max(.4,pf));
  if(SQ.axis==='x'){sx*=pf;sy*=inv}else{sy*=pf;sx*=inv}
  g.style.transform=`translateX(${(SQ.tx+shv).toFixed(1)}px) rotate(${SQ.rot.toFixed(2)}deg) skewX(${SQ.sk.toFixed(2)}deg) scale(${sx.toFixed(3)},${sy.toFixed(3)})`;

function sqMove(e){

function radarSVG(v,prev){
  const R=58,cx=100,cy=100,mxv=Math.max(...AB.map(k=>Math.max(v[k]||0,prev?prev[k]||0:0)));
  const mx=Math.min(100,Math.max(30,Math.ceil((mxv+6)/10)*10));
  const xy=(i,val)=>{const a=(-90+60*i)*Math.PI/180,r=R*Math.min(1,val/mx);return [cx+Math.cos(a)*r,cy+Math.sin(a)*r]};
  const pts=f=>AB.map((k,i)=>xy(i,f(k)).map(n=>n.toFixed(1)).join(',')).join(' ');
  let s='<svg viewBox="0 0 200 200" aria-hidden="true">';
  s+=`<polygon points="${pts(()=>mx)}" fill="var(--paper2)" stroke="var(--line2)" stroke-width="3" stroke-linejoin="round"/>`;
  [2/3,1/3].forEach(f=>s+=`<polygon points="${pts(()=>mx*f)}" fill="none" stroke="var(--line)" stroke-width="1.6" stroke-linejoin="round"/>`);
  if(prev)s+=`<polygon points="${pts(k=>prev[k]||0)}" fill="none" stroke="var(--sub)" stroke-width="2" stroke-dasharray="4 4" stroke-linejoin="round"/>`;
  s+=`<polygon points="${pts(k=>Math.max(v[k]||0,mx*.05))}" fill="#7cc86a" fill-opacity=".55" stroke="#4f9a42" stroke-width="3" stroke-linejoin="round"/>`;
  AB.forEach((k,i)=>{const [x,y]=xy(i,Math.max(v[k]||0,mx*.05));s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="#fff" stroke="#4f9a42" stroke-width="2.5"/>`});
  return s+'</svg>';
}

function renderPanel(){const n=$('#panel').dataset.name;({rel:renderRel,dex:renderDex,settings:renderSettings,toys:renderToys})[n]();$('#pin').querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{Sound.play('click');closePanel()})}
function panelHead(icon,title){return `<div class="ph"><button class="rbtn" data-x aria-label="뒤로">${ic('back')}</button><h2 class="cute">${ic(icon)}${title}</h2></div>`}
const HELP=`<ul class="help">
<li>아래 7칸이 이번 주 일정이에요. 칸을 누르면 공부·운동·놀이·알바·휴식 중에서 세부 활동을 고를 수 있어요. 한 주가 끝나면 일정은 비워져요.</li>
<li>활동 카드의 점은 대략적인 성격이에요. 무엇이 자라는지, 얼마나 지치는지, 돈을 쓰는지 버는지를 비교해서 골라요.</li>
<li>능력치는 지력·교양·예술·무술·체력·매력 여섯 가지예요. 같은 능력을 꾸준히 키우면 점점 더 잘 오르고, 능력이 오르면 새 활동과 선택지가 열려요.</li>
<li>매력이 높으면 친구와 빨리 친해지고, 교양이 높으면 서운함과 땡땡이가 줄어요. 체력은 몸 쓰는 일의 피로를 줄여 줘요.</li>
<li>놀이 › 뽑기방에서 장난감을 뽑고, 놀이 › 장난감 교환에서 친구들과 바꿔요. 친구마다 좋아하는 장난감이 달라서 취향을 맞추면 더 친해져요. 세트를 완성하면 보상이 있어요.</li>
<li>4주마다 일요일에 특별 이벤트가 열리고, 한 장이 끝날 때 용돈 봉투를 받아요.</li>
<li>말랑이는 매일 저녁 집에 돌아와 밥을 먹어요. 밥값이 들고 몸무게가 조금 늘어요.</li>
<li>두 손가락으로 말랑이 양쪽을 잡고 벌리면 쭉 늘어나요. 종류마다 늘어나는 정도와 돌아오는 속도가 달라요.</li>
<li>활동하는 날엔 그 장소에 맞는 작은 선택이 생기고, 친구와 친해질수록 약속·선물·다툼 같은 이야기가 이어져요.</li>
<li>말랑이를 꾹 누르거나, 오래 누르거나, 위로 끌어 늘리거나, 좌우로 흔들어 보세요. 젤리는 출렁, 빵은 자국이 남았다 부풀고, 크런치는 버티다 바삭 깨지는 등 종류마다 촉감이 완전히 달라요.</li>
<li>장난감 상자에서 장난감을 누르면 말랑이가 직접 가지고 놀아요. 가끔은 혼자 꺼내 놀기도 해요.</li>
<li>12주가 지나면 말랑이의 이야기를 돌아보고, 말랑이가 남긴 가챠캡슐 3개 중 하나를 열어 다음 말랑이를 만나요.</li></ul>`;

/* ---------- 주간 계획: 7칸 스트립 + 카테고리 탭 + 같은 규격의 활동 카드 ---------- */
function setMode(m){ui.mode=m;document.body.className='mode-'+m;renderStrip();renderActions();if(m==='plan')renderPlanner();updHz();setTimeout(updHz,420)}
// 방의 바닥선을 말랑이가 앉은 러그 높이에 맞춘다 (화면 모드에 따라 무대 높이가 바뀌므로)
function updHz(){if(ui.place==='pool'||ui.place==='spa')setTimeout(()=>setWater(ui.place),0);const st=$('#stage'),mg=$('#mlg');if(!st||!mg)return;const w=mg.getBoundingClientRect().width;$('#app').style.setProperty('--hz',Math.round(st.offsetTop+st.offsetHeight-w*.2)+'px')}
function firstEmpty(){const i=G.schedule.findIndex(x=>!x);return i<0?0:i}
function enterPlan(day){
  if(G.phase!=='plan'||ui.running)return;
  ui.pickerDay=day!=null?day:firstEmpty();ui.infoId=null;
  const a=G.schedule[ui.pickerDay];if(a)ui.pkCat=SUBS[a].cat;
  Sound.play('click');setMode('plan');tip('plan',350);
}
function renderStrip(){
  const el=$('#strip');if(!el)return;
  el.innerHTML=DAYS.map((d,i)=>{
    const a=G.schedule[i],A=a&&SUBS[a],c=['tile'];
    if(!A)c.push('empty');if(i>=5)c.push('we');
    if(ui.running){if(i===ui.day)c.push('now');else if(i<ui.day)c.push('done')}
    else if(ui.mode==='plan'&&i===ui.pickerDay)c.push('sel');
    const fest=i===6&&G.week%4===0&&G.phase==='plan';
    return `<button class="${c.join(' ')}" data-i="${i}" style="${A?`--tc:${CATS[A.cat].col}`:''}" aria-label="${DAYF[i]} ${A?A.name:'비어 있음'}"><span class="td">${d}</span><span class="ti">${A?ic(a):ic('plus')}</span>${fest?`<i class="tbadge">${ic('star')}</i>`:''}</button>`;
  }).join('');
  el.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{
    if(ui.running||G.phase!=='plan')return;
    const i=+b.dataset.i;
    if(ui.mode!=='plan'){enterPlan(i);return}
    Sound.play('click');ui.pickerDay=i;ui.infoId=null;const a=G.schedule[i];if(a)ui.pkCat=SUBS[a].cat;renderStrip();renderPlanner();
  });
}
function pips(n,cls){let s='';for(let i=0;i<3;i++)s+=`<i class="pp ${cls}${i<n?' f':''}"></i>`;return s}
function meterHTML(id){
  const A=SUBS[id],items=Object.entries(A.gain||{}).map(([k,v])=>[k,Math.min(3,v)]);
  if(!items.length)Object.entries(A.side||{}).forEach(([k,v])=>{if(v>0)items.push([k,1])});
  if(A.aff)items.push(['aff',A.aff>=5?2:1]);
  if(A.friend)items.push(['friends',2]);
  const r1=items.length?items.slice(0,2).map(([k,n])=>`<span class="mt">${ic(k)}${pips(n,'g')}</span>`).join(''):'<span class="mfree">자라는 건 없어요</span>';
  const st=A.stress||0;
  const t=st>0?`<span class="mt">${ic('stress')}${pips(st>=12?3:st>=6?2:1,'t')}</span>`:`<span class="mt">${ic('relax')}${pips(st<=-20?3:st<=-10?2:1,'r')}</span>`;
  const p0=A.pay?A.pay({int:0,str:0,cha:0}):0;
  const mo=A.pay?`<span class="mt">${ic('coin')}${pips(p0>=80?3:p0>=50?2:1,'p')}</span>`:A.cost?`<span class="mt">${ic('coin')}${pips(A.cost>=30?3:A.cost>=20?2:1,'c')}</span>`:`<span class="mt">${ic('coin')}<span class="mfree">무료</span></span>`;
  return `<span class="meters"><span class="mrow">${r1}</span><span class="mrow">${t}${mo}</span></span>`;
}
function lockShort(t){const m=t.match(/^(\S+?)[이가] (\d+) 이상/);return m?`${m[1]} ${m[2]}`:t.startsWith('친구')?'친구를 만나면':t.replace(' 열려요','')}
const LEGEND=`<span class="lgd"><i class="pp g f"></i>자람 <i class="pp t f"></i>지침 <i class="pp r f"></i>쉼 <i class="pp c f"></i>돈 씀 <i class="pp p f"></i>돈 벌기</span>`;
function renderInfo(){
  const el=$('#sinfo'),id=ui.infoId;
  if(id&&SUBS[id]){
    const A=SUBS[id],ok=isUnlocked(id);
    el.innerHTML=`<div style="display:flex;align-items:center;gap:6px"><b>${A.name}</b><span class="sub" style="display:flex;align-items:center;gap:2px">${ic('pin','')}${PLACES[A.place].n}</span></div>`+
      (ok?`<span class="tags">${subTags(id).map(([k,t])=>`<em class="${k}">${t}</em>`).join('')}</span>${A.note?`<span class="sub">${A.note}</span>`:''}`:`<span class="sub" style="display:flex;align-items:center;gap:4px">${ic('lock')}${A.lock.t}</span>`);
  }else{
    const a=G.schedule[ui.pickerDay];
    el.innerHTML=`<div class="dir">${ic('calendar')}${DAYF[ui.pickerDay]}${a?` · ${SUBS[a].name}`:'엔 뭐 할까?'}</div>${promiseHint()}<span class="sub">${G.week%4===0?'이번 주 일요일엔 특별 이벤트가 있어요! · ':''}${planDirection()}</span>${LEGEND}`;
  }
}
function promiseHint(){const p=G.malang.flags.promise;if(!p||p.week!==G.week||!NPCS[p.id])return '';const sch=G.schedule.includes(p.sub);return `<span class="prom${sch?' ok':''}">${ic('calendar')}${jo(NPCS[p.id].name,'과','와')} 약속 · 이번 주 ${SUBS[p.sub].name}${sch?' (일정에 있어요)':' 가기'}</span>`}
const MSC=new Map();function miniScene(p){if(!MSC.has(p))MSC.set(p,placeSVG(p).replace('preserveAspectRatio="xMidYMax slice"','preserveAspectRatio="xMidYMid slice"').replace('viewBox="0 0 400 400"','viewBox="0 30 400 340"'));return MSC.get(p)}
function renderPlanner(){
  const cat=ui.pkCat||'study';
  $('#ctabs').innerHTML=CAT_IDS.map(c=>`<button class="ctab${c===cat?' on':''}" data-c="${c}" style="--cc:${CATS[c].col}">${ic('c_'+c)}${CATS[c].name}</button>`).join('');
  $('#sgrid').innerHTML=SUB_IDS.filter(id=>SUBS[id].cat===cat).map(id=>{
    const A=SUBS[id],ok=isUnlocked(id),on=G.schedule[ui.pickerDay]===id;
    return `<button class="scard sc4${on?' on':''}${ok?'':' lock'}${['arcade','karaoke'].includes(A.place)?' soft-art':''}" data-id="${id}" style="--cc:${CATS[cat].col}"><span class="sc-art">${miniScene(A.place)}</span><span class="sc-badge">${ic(id)}</span><span class="sc-info"><span class="sc-n">${A.name}</span>${meterHTML(id)}</span><i class="sc-glow"></i>${ok?'':`<span class="sc-lock">${ic('lock')}${lockShort(A.lock.t)}</span>`}</button>`;
  }).join('');
  renderInfo();
  $('#ctabs').querySelectorAll('.ctab').forEach(b=>b.onclick=()=>{Sound.play('click');ui.pkCat=b.dataset.c;ui.infoId=null;renderPlanner()});
  $('#sgrid').querySelectorAll('.scard').forEach(b=>b.onclick=()=>{
    const id=b.dataset.id;
    if(!isUnlocked(id)){Sound.play('rebel');ui.infoId=id;renderInfo();return}
    setSlot(ui.pickerDay,id);
  });
}
function planDirection(){
  const cnt={};let n=0;
  G.schedule.forEach(a=>{if(!a)return;n++;const A=SUBS[a];
    for(const k in A.gain||{})cnt[k]=(cnt[k]||0)+2;
    for(const k in A.side||{})if(A.side[k]>0)cnt[k]=(cnt[k]||0)+1;
    if(A.cat==='play')cnt._play=(cnt._play||0)+1.5;if(A.pay)cnt._money=(cnt._money||0)+2;if(A.cat==='rest')cnt._rest=(cnt._rest||0)+2});
  if(!n)return '이번 주엔 어떤 말랑이로 키워 볼까요?';
  const lab={_play:'놀기',_money:'돈 벌기',_rest:'쉬기'};
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k])=>lab[k]||STATS[k].n);
  return `이번 주는 ${top.join(', ')} 위주 · ${n}/7일`;
}
function setSlot(i,id){
  G.schedule[i]=id;Sound.play('pick');ui.infoId=id;
  let next=-1;for(let k=1;k<=7;k++){const j=(i+k)%7;if(!G.schedule[j]){next=j;break}}
  if(next>=0)ui.pickerDay=next;
  save();renderStrip();renderPlanner();renderActions();
  const cat=SUBS[id].cat;
  if(Math.random()<.5){speak(Math.random()<.5?talk('pick'):pick(L.pick[cat]),1100);setFace(cat==='play'||cat==='rest'?'happy':moodFace());clearTimeout(ui.faceT);ui.faceT=setTimeout(()=>{if(!ui.running)setFace(moodFace())},1100)}
}
function renderActions(){
  const el=$('#actions');if(!el)return;const full=G.schedule.every(Boolean);
  if(ui.mode==='run'){
    el.innerHTML=`<div class="runlbl">${G.week}주차 생활 중 <span class="dotty"><i></i><i></i><i></i></span></div><button class="tbtn ghost" id="ffBtn" style="padding:0 14px" aria-label="빠르게">${ic('ff')}<span>${speed}x</span></button>`;
    $('#ffBtn').onclick=()=>{speed=speed===1?2:speed===2?4:1;try{localStorage.setItem(SPKEY,speed)}catch(e){};Sound.play('click');renderActions()};
  }else if(ui.mode==='plan'){
    el.innerHTML=`<button class="tbtn ghost sq" id="aBack" aria-label="닫기">${ic('back')}</button><button class="tbtn grow1" id="aGo" ${full?'':'disabled'}>${ic('play')}${full?'이번 주 시작':`${G.schedule.filter(Boolean).length}/7일 골랐어요`}</button><button class="tbtn ghost sq" id="aClr" aria-label="모두 비우기">${ic('trash')}</button>`;
    $('#aBack').onclick=()=>{Sound.play('click');setMode('home')};
    $('#aGo').onclick=()=>{if(G.schedule.every(Boolean))runWeek()};
    $('#aClr').onclick=()=>{Sound.play('click');G.schedule=Array(7).fill(null);ui.pickerDay=0;ui.infoId=null;save();renderStrip();renderPlanner();renderActions()};
  }else{
    const end=G.phase==='ending',dot=metIds().length&&!ui.relSeen;
    const main=end?`<button class="dk main" id="aEnd"><span class="pop">${ic('star')}</span>12주의 이야기<small>엔딩 보러 가기</small></button>`
      :full?`<button class="dk main" id="aGo"><span class="pop">${ic('play')}</span>${G.week}주차 시작<small>일정은 아래 칸을 눌러 고쳐요</small></button>`
      :`<button class="dk main" id="aPlan"><span class="pop">${ic('calendar')}</span>일정 짜기<small>${G.week}주차 · ${G.schedule.filter(Boolean).length}/7일</small></button>`;
    el.innerHTML=`<div class="dock"><button class="dk" data-open="rel"><span class="pop">${ic('rel')}</span>관계${dot?'<i class="dot" id="relDot"></i>':''}</button>${main}<button class="dk" data-open="toys"><span class="pop">${ic('toybox')}</span>장난감</button></div>`;
    el.querySelectorAll('.dk[data-open]').forEach(b=>b.onclick=()=>openPanel(b.dataset.open));
    if($('#aEnd'))$('#aEnd').onclick=()=>{Sound.play('click');resumeEnding()};
    if($('#aGo'))$('#aGo').onclick=()=>runWeek();
    if($('#aPlan'))$('#aPlan').onclick=()=>enterPlan();
  }
}
function heartsHTML(a){const v=clamp(a,0,100)/20,f=Math.floor(v),h=v-f>=.5?1:0;let s='';for(let i=0;i<5;i++)s+=i<f?ic('aff'):i===f&&h?`<span style="opacity:.55;display:inline-flex">${ic('aff')}</span>`:ic('aff','e');return `<span class="hearts">${s}</span>`}

  }).join('');
  const gifts='';
  $('#pin').innerHTML=`${panelHead('rel','관계')}<div class="pb">${gifts}${cards||'<p class="hint">아직 만난 말랑이가 없어요.</p>'}${un?`<div class="unmet">아직 만나지 못한 말랑이가 ${un}명 더 있어요.<br>어디서 시간을 보내느냐에 따라 만나는 친구가 달라요.</div>`:''}</div>`;
  $('#pin').querySelectorAll('.rcard').forEach(b=>b.onclick=()=>{Sound.play('click');ui.openRel=ui.openRel===b.dataset.id?null:b.dataset.id;renderRel()});

function renderDex(){
  const d=G.dex,evN=Object.keys(d.ev).length,endN=Object.keys(d.end).length,spR=SP_ORDER.filter(x=>d.sp[x]==='raised').length,v=d.viewed||{};

  const npcs=NPC_IDS.map(id=>d.npc[id]?`<button class="etile sp" data-npc="${id}">${malangSVG({sp:NPCS[id].sp,pal:NPCS[id].pal,w:NPCS[id].w,face:NPCS[id].face,acc:NPCS[id].acc})}<b>${NPCS[id].name}</b><small>${G.malang.rel[id]&&G.malang.rel[id].met?relLabel(id):'예전에 만났어요'}</small></button>`:`<div class="etile no">${ic('qmark')}???</div>`).join('');

function mkCtx(act,sub){
  const m=G.malang,tot=['study','exercise','play','work','rest'].reduce((a,k)=>a+m.hist[k],0);
  return {act,sub,sp:m.species,s:m.stats,week:G.week,money:G.money,F:m.flags,H:m.hist,
    met:id=>!!(m.rel[id]&&m.rel[id].met),aff:id=>m.rel[id]?m.rel[id].aff:0,
    share:a=>tot?m.hist[a]/tot:0,metList:()=>metIds()};
}
function pickEvent(c){
  const m=G.malang,list=[];let sum=0;
  for(const e of EVENTS){
    const seen=m.seenEv[e.id];
    if(seen!==undefined){if(e.once)continue;if(G.week-seen<(e.cd||3))continue}
    if(e.acts&&!e.acts.includes(c.act))continue;
    if(e.subs&&!e.subs.includes(c.sub))continue;
    let w=0;try{w=e.w(c)}catch(err){w=0}
    if(w>0&&e.npc&&!e.act&&!e.big&&!e.wild&&e.place!=='home'){const cur=SUBS[c.sub]?SUBS[c.sub].place:null,f=placeFit(e,cur);if(e.strict&&f<2)w=0;else w*=f===2?1.6:f===1?1:.3}
    if(w>0){const nid=typeof e.npc==='string'?e.npc:null;if(nid&&m.rel[nid]&&!m.rel[nid].met)w*=3;list.push([e,w]);sum+=w}
  }
  if(!list.length)return null;
  let r=Math.random()*sum;for(const [e,w] of list){r-=w;if(r<=0)return e}
  return list[list.length-1][0];
}
// 매력이 높으면 더 빨리 친해지고, 교양이 높으면 덜 서운해한다. 좋아하는 능력이 30 이상이면 보너스
function changeAff(id,v){const st=G.malang.rel[id];if(!st)return 0;const s=G.malang.stats;
  const cp=(COMPAT[id]||[]).includes(G.malang.persona)?1.2:1;
  let a=v>0?Math.round(v*cp*(1+s.cha/150))+((s[NPC_LIKES[id]]||0)>=30?2:0):Math.round(v*(1-s.cul/200));
  st.aff=clamp(st.aff+a,-30,100);return a}
function addMem(id,t){const st=G.malang.rel[id];if(!st)return;if(st.mem.length&&st.mem[st.mem.length-1].t===t&&st.mem[st.mem.length-1].w===G.week)return;st.mem.push({w:G.week,t});if(st.mem.length>16)st.mem.splice(1,1)}
function affText(id,v){const n=NPCS[id].name;return v>=12?`${jo(n,'과','와')} 부쩍 가까워졌어요`:v>0?`${jo(n,'과','와')} 조금 가까워졌어요`:v<=-12?`${jo(n,'과','와')} 사이가 많이 서먹해졌어요`:`${jo(n,'이','가')} 조금 서운해하는 것 같아요`}
function applyResult(r){
  const m=G.malang,out=[];let met=false;
  if(r.meet&&!m.rel[r.meet].met){
    const st=m.rel[r.meet];st.met=true;st.metWeek=G.week;if(m.traits.includes('social'))st.aff+=8;
    G.dex.npc[r.meet]=1;met=true;ui.relSeen=false;tip('rel',400);
    out.push({i:'npc:'+r.meet,t:`새로운 말랑이 '${NPCS[r.meet].name}'${jo(NPCS[r.meet].name,'을','를').slice(-1)} 만났어요!`});
  }
  if(r.d){const ch=applyDelta(r.d,{quiet:true});for(const [k,v] of Object.entries(ch))out.push({i:SM[k][0],t:`${SM[k][1]} ${fmtD(k,v)}`})}
  if(r.npc)for(const [id,v] of Object.entries(r.npc)){if(!v||!m.rel[id].met)continue;const a=changeAff(id,v);out.push({i:'npc:'+id,t:affText(id,a)})}
  if(r.party){metIds().forEach(id=>changeAff(id,r.party));if(metIds().length)out.push({i:'friends',t:'친구들 모두와 조금씩 가까워졌어요'})}
  if(r.mem)for(const [id,t] of Object.entries(r.mem))addMem(id,t);
  if(r.flag){
    Object.assign(m.flags,r.flag);
    for(const k of Object.keys(r.flag))if(k.startsWith('bond_')){const n=NPCS[k.slice(5)].name;out.push({i:'sparkle',t:`${jo(n,'과','와')} 단짝이 되었어요!`})}
    if(Object.keys(r.flag).some(k=>CHAIN_FLAGS.has(k)))out.push({i:'bookmark',t:'이 일은 나중에 다시 떠오를지도...'});
  }
  if(r.item){m.items.push(r.item);out.push({i:'gift',t:`'${r.item}' 받았어요`})}
  if(r.promise){const p=r.promise;m.flags.promise={id:p.id,sub:p.sub,week:G.week+1};out.push({i:'calendar',t:`약속: 다음 주 ${SUBS[p.sub].name}에서 ${NPCS[p.id].name} 만나기`})}
  if(r.toy&&TOYS[r.toy]){addToy(r.toy);out.push({i:'toy:'+r.toy,t:`장난감 '${TOYS[r.toy].n}' 획득!`})}
  renderAll();
  return {out,met};
}

function meetIntro(npc,c,cur,fit,ev){
  const sub=c&&c.sub,N=NPCS[npc],g=PGROUP[cur]||'town',met=G.malang.rel[npc]&&G.malang.rel[npc].met;
  const act=ACT_CTX[sub]||'평소처럼 하루를 보내고 있었다.';
  const atP=MEET_AT[cur]&&MEET_AT[cur][npc],core=(MEET_CORE[g]||[]).includes(cur);
  const why=met?(atP||(core?(MEET_WHY[npc]||{})[g]:MEET_ANY[npc])||`${jo(N.name,'이','가')} 다가왔다.`):`처음 보는 ${N.tag} 말랑이가 이쪽을 보고 있었다.`;

  if(fit===0&&PLACES[ev.place])text+=` "잠깐 같이 갈래?" ${jo(N.name,'을','를')} 따라 ${jo(PLACES[ev.place].n,'으로','로')} 향했다.`;
  return {place:cur||ev.place,text};
}
